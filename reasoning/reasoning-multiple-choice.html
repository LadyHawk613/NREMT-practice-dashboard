<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 14: Advanced NREMT-Style Practice Questions</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        main {
            max-width: 720px;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #f97316;
            color: white;
            padding: 24px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        header p {
            font-size: 0.85rem;
            opacity: 0.9;
            font-weight: 400;
        }
        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
        }
        .quiz-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .stage-badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 0.05em;
        }
        .score-badge {
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 6px;
        }
        .content-area {
            margin-bottom: 16px;
        }
        .question-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.4;
            margin-bottom: 14px;
            white-space: pre-line;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            padding: 10px 14px;
            border-radius: 10px;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #334155;
            line-height: 1.3;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }
        .option-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: #f1f5f9;
            color: #475569;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            background: #fff7ed;
            border-color: #fed7aa;
        }
        .option-btn:hover:not(:disabled) .option-letter {
            background: #ffedd5;
            color: #c2410c;
        }
        .option-btn.correct {
            background: #f0fdf4 !important;
            border-color: #22c55e !important;
            color: #166534 !important;
        }
        .option-btn.correct .option-letter {
            background: #dcfce7 !important;
            color: #166534 !important;
        }
        .option-btn.incorrect {
            background: #fef2f2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }
        .option-btn.incorrect .option-letter {
            background: #fee2e2 !important;
            color: #991b1b !important;
        }
        .rationale-box {
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.85rem;
            color: #166534;
            margin-bottom: 14px;
            display: none;
            line-height: 1.35;
            white-space: pre-line;
            max-height: 110px;
            overflow-y: auto;
        }
        .rationale-box.visible {
            display: block;
        }
        .footer-nav {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 14px;
        }
        .nav-btn {
            background: #f97316;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .nav-btn:hover {
            background: #ea580c;
        }
        .nav-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <main>
        <div class="card">
            <header>
                <h1>Advanced NREMT Practice</h1>
                <p>NREMT Cognitive Exam (Clinical Reasoning)</p>
            </header>

            <div class="card-body">
                <div class="quiz-header-row">
                    <div class="stage-badge" id="stage-badge">Question 1 of 20</div>
                    <div class="score-badge" id="score-display">Score: 0</div>
                </div>
                
                <div class="content-area">
                    <div class="question-text" id="question-text">Loading question...</div>
                    <div class="options-list" id="options-list"></div>
                    <div class="rationale-box" id="rationale-box"></div>
                </div>
                
                <div class="footer-nav">
                    <button class="nav-btn" id="next-btn" onclick="nextQuestion()" disabled>Next Question</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const quizData = [
            {
                title: "Question 1 — Respiratory Failure Progression",
                question: "You are treating a 58-year-old male with a history of COPD. He is sitting upright, struggling to breathe (RR: 32, SpO₂: 86%). After administering oxygen, he becomes tired and less responsive (RR: 8, shallow, SpO₂: 84%). What is the MOST appropriate next action?",
                options: [
                    "Increase oxygen flow rate and reassess in 10 minutes",
                    "Assist ventilations with a bag-valve mask",
                    "Obtain a complete SAMPLE history",
                    "Administer the patient's prescribed inhaler"
                ],
                correct: 1,
                rationale: "Rationale: The patient has progressed from respiratory distress to respiratory failure. Oxygen alone will not correct inadequate ventilation."
            },
            {
                title: "Question 2 — Trauma Priority",
                question: "You arrive at a motorcycle crash involving a 26-year-old male with an open femur fracture, severe pain, respirations of 24/min, cool and pale skin, and a weak radial pulse. What should you do FIRST?",
                options: [
                    "Apply a traction splint",
                    "Control bleeding and treat for shock",
                    "Perform a detailed assessment of the leg injury",
                    "Administer pain medication if available"
                ],
                correct: 1,
                rationale: "Rationale: The femur injury is significant, but signs of shock indicate a more immediate threat."
            },
            {
                title: "Question 3 — Airway vs History",
                question: "A 44-year-old female presents with facial swelling, difficulty swallowing, a hoarse voice, a rash on her chest, and states she has never had allergies before. What should you do FIRST?",
                options: [
                    "Determine what caused the allergic reaction",
                    "Obtain a complete medication history",
                    "Assess airway and prepare appropriate treatment",
                    "Document the patient's allergy history"
                ],
                correct: 2,
                rationale: "Rationale: The airway symptoms indicate possible airway compromise."
            },
            {
                title: "Question 4 — Compensated Shock",
                question: "A patient involved in a car crash has a heart rate of 118, blood pressure of 118/76, respiratory rate of 24, pale, cool skin, and anxiety. Which statement is MOST accurate?",
                options: [
                    "The patient is stable because blood pressure is normal",
                    "The patient is showing signs of compensated shock",
                    "The patient is experiencing only emotional stress",
                    "The patient does not require rapid transport"
                ],
                correct: 1,
                rationale: "Rationale: Blood pressure may remain normal during early shock."
            },
            {
                title: "Question 5 — Pediatric Airway",
                question: "A 5-year-old child has a fever, drooling, stridor, is sitting forward, and refusing to lie down. What is the BEST action?",
                options: [
                    "Use a tongue depressor to inspect the throat",
                    "Keep the child calm and provide oxygen",
                    "Place the child supine for assessment",
                    "Obtain a complete SAMPLE history first"
                ],
                correct: 1,
                rationale: "Rationale: Agitating the child may worsen airway obstruction."
            },
            {
                title: "Question 6 — Stroke Recognition",
                question: "A 73-year-old male suddenly develops right-sided weakness, slurred speech, and facial droop. His blood glucose is 104 mg/dL. What should you do?",
                options: [
                    "Administer oral glucose",
                    "Perform a rapid stroke assessment and transport",
                    "Wait to see if symptoms resolve",
                    "Give aspirin if chest pain develops"
                ],
                correct: 1,
                rationale: "Rationale: Sudden neurological deficits warrant rapid stroke assessment and transport after ruling out hypoglycemia."
            },
            {
                title: "Question 7 — Distractor Identification",
                question: "A patient complains of chest pain with a history of diabetes, hypertension, arthritis, and high cholesterol. Vital signs are BP 132/84, HR 96, RR 18. Which finding is MOST important?",
                options: [
                    "History of arthritis",
                    "Normal blood pressure",
                    "Chest pain with cardiac risk factors",
                    "Patient's age"
                ],
                correct: 2,
                rationale: "Rationale: Chest pain in the presence of cardiac risk factors highlights the primary complaint requiring critical cardiac evaluation."
            },
            {
                title: "Question 8 — Burn Priorities",
                question: "You respond to a house fire and find a patient with burns to the arms and chest, soot around the mouth, a hoarse voice, and singed nasal hair. What is your priority?",
                options: [
                    "Calculate total body surface area burned",
                    "Cover burns with sterile dressings",
                    "Assess airway and prepare oxygen therapy",
                    "Obtain burn history"
                ],
                correct: 2,
                rationale: "Rationale: Inhalation signs dictate airway and oxygenation as the absolute priority."
            },
            {
                title: "Question 9 — Geriatric Trauma",
                question: "An 84-year-old patient falls and insists they are fine, but takes blood thinners and presents with increasing confusion and vomiting. What is the MOST appropriate action?",
                options: [
                    "Respect the patient's wishes because there is no pain",
                    "Suspect serious head injury and recommend transport",
                    "Allow the patient to rest and reassess later",
                    "Focus on determining why the patient fell"
                ],
                correct: 1,
                rationale: "Rationale: Anticoagulant use combined with altered mental status and vomiting strongly indicates occult intracranial hemorrhage."
            },
            {
                title: "Question 10 — Medication Decision",
                question: "A patient with asthma is wheezing and has a prescribed inhaler. Before assisting with the medication, you should:",
                options: [
                    "Confirm the medication belongs to the patient and follow protocol",
                    "Give oxygen only because EMTs cannot assist medications",
                    "Administer additional doses to ensure effectiveness",
                    "Wait until respiratory distress becomes severe"
                ],
                correct: 0,
                rationale: "Rationale: Always verify right patient, medication, dose, route, and expiration date before assistance."
            },
            {
                title: "Question 11 — OB/GYN Priority",
                question: "A pregnant patient at 39 weeks states the baby is coming, and crowning is visible. What should you do?",
                options: [
                    "Transport immediately before delivery occurs",
                    "Prepare for delivery and provide support",
                    "Attempt to delay delivery",
                    "Obtain a complete medical history"
                ],
                correct: 1,
                rationale: "Rationale: Crowning indicates imminent delivery; transport must be delayed to manage delivery safely on scene."
            },
            {
                title: "Question 12 — Multiple-Casualty Incident Priority",
                question: "You arrive at a multiple-casualty incident. Which patient should receive care FIRST?\n\n• Patient A: Broken wrist, alert, walking\n• Patient B: Deep leg laceration, blood rapidly pooling, weak radial pulse\n• Patient C: Chest pain, alert, skin warm/dry\n• Patient D: Respiratory distress, cyanotic lips, RR 34/min",
                options: [
                    "Patient A",
                    "Patient B",
                    "Patient C",
                    "Patient D"
                ],
                correct: 1,
                rationale: "Rationale: Patient B has uncontrolled hemorrhage, an immediate life threat requiring immediate control."
            },
            {
                title: "Question 13 — Reassessment",
                question: "After treating a patient and completing initial interventions, the EMT should:",
                options: [
                    "Begin documentation immediately",
                    "Reassess the patient and determine response",
                    "Obtain a second SAMPLE history",
                    "Wait until arrival at the hospital"
                ],
                correct: 1,
                rationale: "Rationale: Continuous or periodic reassessment is essential to evaluate intervention effectiveness."
            },
            {
                title: "Question 14 — Altered Mental Status",
                question: "A diabetic patient is confused with a blood glucose of 42 mg/dL, but can swallow and follows commands. What is appropriate?",
                options: [
                    "Give oral glucose according to protocol",
                    "Begin CPR",
                    "Force fluids orally",
                    "Delay treatment until family arrives"
                ],
                correct: 0,
                rationale: "Rationale: Conscious hypoglycemic patients with a protected airway can safely receive oral glucose."
            },
            {
                title: "Question 15 — Scope of Practice",
                question: "A patient experiencing acute discomfort asks you to administer their friend's prescription medication. What should you do?",
                options: [
                    "Give the medication because symptoms are similar",
                    "Refuse and provide appropriate care within EMT scope",
                    "Give half the dose",
                    "Wait until symptoms worsen"
                ],
                correct: 1,
                rationale: "Rationale: EMTs must operate strictly within their scope of practice and never administer unprescribed medications."
            },
            {
                title: "Question 16 — Trauma Mechanism",
                question: "A patient involved in a high-speed collision has no obvious external injuries. Which statement is MOST accurate?",
                options: [
                    "The patient does not need assessment because there are no injuries",
                    "Mechanism suggests possible hidden injuries",
                    "The patient can refuse because they feel fine",
                    "Only visible injuries require treatment"
                ],
                correct: 1,
                rationale: "Rationale: High-energy mechanisms of injury can cause severe internal trauma despite a lack of external signs."
            },
            {
                title: "Question 17 — Respiratory Assessment",
                question: "A patient has been breathing rapidly due to acute respiratory distress. Which finding indicates the patient may be failing?",
                options: [
                    "Anxiety",
                    "Wheezing",
                    "Decreasing respiratory rate with altered mental status",
                    "Mild coughing"
                ],
                correct: 2,
                rationale: "Rationale: As a patient tires, respirations slow dangerously and mental status declines."
            },
            {
                title: "Question 18 — Choosing Between Two Good Answers",
                question: "A patient with chest pain is pale and sweaty. Between obtaining vital signs versus applying oxygen if indicated and preparing transport, which is the better FIRST action?",
                options: [
                    "A",
                    "B",
                    "Both are incorrect",
                    "Either is equally appropriate"
                ],
                correct: 1,
                rationale: "Rationale: Treatment priorities and preparation for transport come before completing detailed routine assessments."
            },
            {
                title: "Question 19 — Progressive Change",
                question: "A patient initially has an alert mental status and normal breathing, but ten minutes later is confused, has a weak pulse, and rapid breathing. What changed?",
                options: [
                    "The patient's diagnosis",
                    "The patient's priority level",
                    "The need for assessment",
                    "The patient's consent"
                ],
                correct: 1,
                rationale: "Rationale: Clinical deterioration shifts the patient from stable/urgent to an immediate life-threat priority level."
            },
            {
                title: "Question 20 — Final Clinical Judgment Challenge",
                question: "You arrive for an unresponsive patient whose airway is open, breathing is shallow, and pulse is present. What should you do?",
                options: [
                    "Obtain medical history",
                    "Begin assisted ventilations",
                    "Check blood pressure first",
                    "Ask family what happened"
                ],
                correct: 1,
                rationale: "Rationale: An unresponsive patient with shallow breathing requires immediate airway management and assisted ventilations."
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let answered = false;

        const letters = ['A', 'B', 'C', 'D'];

        function loadQuestion() {
            answered = false;
            const q = quizData[currentIndex];
            
            document.getElementById('stage-badge').innerText = `Question ${currentIndex + 1} of ${quizData.length}`;
            document.getElementById('question-text').innerText = q.question;
            
            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                
                const spanLetter = document.createElement('span');
                spanLetter.className = 'option-letter';
                spanLetter.innerText = letters[idx];
                
                const spanText = document.createElement('span');
                spanText.innerText = opt;
                
                btn.appendChild(spanLetter);
                btn.appendChild(spanText);
                
                btn.onclick = () => selectOption(idx);
                optionsList.appendChild(btn);
            });

            const rationaleBox = document.getElementById('rationale-box');
            rationaleBox.innerText = '';
            rationaleBox.classList.remove('visible');

            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = true;
            nextBtn.innerText = currentIndex === quizData.length - 1 ? "Finish Quiz" : "Next Question";
        }

        function selectOption(selectedIndex) {
            if (answered) return;
            answered = true;

            const q = quizData[currentIndex];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.correct) {
                    btn.classList.add('correct');
                } else if (idx === selectedIndex) {
                    btn.classList.add('incorrect');
                }
            });

            if (selectedIndex === q.correct) {
                score++;
            }

            document.getElementById('score-display').innerText = `Score: ${score}`;

            const rationaleBox = document.getElementById('rationale-box');
            rationaleBox.innerText = q.rationale;
            rationaleBox.classList.add('visible');

            document.getElementById('next-btn').disabled = false;
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < quizData.length) {
                loadQuestion();
            } else {
                showFinalScore();
            }
        }

        function showFinalScore() {
            const cardBody = document.querySelector('.card-body');
            const percentage = Math.round((score / quizData.length) * 100);
            cardBody.innerHTML = `
                <div style="text-align: center; padding: 20px 10px;">
                    <h2 style="font-size: 1.3rem; color: #0f172a; margin-bottom: 8px;">Quiz Complete!</h2>
                    <p style="font-size: 1rem; color: #475569; margin-bottom: 12px;">Final Score: <strong>${score}</strong> / <strong>${quizData.length}</strong> (${percentage}%)</p>
                    <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 20px; line-height: 1.4;">You have completed the advanced NREMT-style practice questions focused on clinical judgment and prioritization.</p>
                    <button class="nav-btn" onclick="resetQuiz()">Restart Quiz</button>
                </div>
            `;
            document.getElementById('stage-badge').innerText = "Complete";
        }

        function resetQuiz() {
            currentIndex = 0;
            score = 0;
            document.getElementById('score-display').innerText = `Score: 0`;
            const cardBody = document.querySelector('.card-body');
            cardBody.innerHTML = `
                <div class="quiz-header-row">
                    <div class="stage-badge" id="stage-badge">Question 1 of 20</div>
                    <div class="score-badge" id="score-display">Score: 0</div>
                </div>
                <div class="content-area">
                    <div class="question-text" id="question-text">Loading question...</div>
                    <div class="options-list" id="options-list"></div>
                    <div class="rationale-box" id="rationale-box"></div>
                </div>
                <div class="footer-nav">
                    <button class="nav-btn" id="next-btn" onclick="nextQuestion()" disabled>Next Question</button>
                </div>
            `;
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
