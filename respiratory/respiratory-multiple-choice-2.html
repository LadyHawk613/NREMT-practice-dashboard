<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NREMT Airway, Respiration & Ventilation Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
        <!-- Header (Indigo Theme) -->
        <div class="bg-indigo-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Airway, Respiration & Ventilation</h1>
            <p class="text-indigo-100 text-sm mt-1">Lesson 11: NREMT-Style Practice Questions (Level 3+)</p>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2">
            <div id="progress" class="bg-indigo-500 h-2 transition-all duration-500" style="width: 0%"></div>
        </div>

        <div id="quiz-container" class="p-6">
            <!-- Question Section -->
            <div id="question-box" class="fade-in">
                <div class="flex justify-between items-center mb-4">
                    <span id="question-number" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Question 1 of 20</span>
                    <span id="score-display" class="text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-1 rounded">Score: 0</span>
                </div>
                
                <h2 id="question-text" class="text-lg font-semibold text-slate-800 mb-6 leading-snug">
                    Loading question...
                </h2>

                <div id="options" class="space-y-3">
                    <!-- Options injected here -->
                </div>

                <!-- Feedback Section (Hidden by default) -->
                <div id="feedback" class="mt-6 p-4 rounded-lg hidden border">
                    <div class="flex items-center mb-2">
                        <span id="feedback-icon" class="mr-2 font-bold"></span>
                        <span id="feedback-status" class="font-bold text-sm uppercase"></span>
                    </div>
                    <p id="feedback-text" class="text-sm text-slate-600 italic"></p>
                </div>

                <!-- Navigation -->
                <button id="next-btn" class="mt-8 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition-colors hidden shadow-md">
                    Next Question
                </button>
            </div>

            <!-- Results Section (Hidden by default) -->
            <div id="results-box" class="hidden text-center py-10 fade-in">
                <div class="text-6xl mb-4">🫁</div>
                <h2 class="text-3xl font-bold text-slate-800 mb-2">Quiz Complete!</h2>
                <p class="text-slate-500 mb-6">You've finished the Airway, Respiration & Ventilation assessment.</p>
                
                <div class="inline-block p-8 bg-indigo-50 rounded-2xl mb-8 border border-indigo-100">
                    <div id="final-score" class="text-5xl font-bold text-indigo-700 mb-2">0/20</div>
                    <div id="percentage" class="text-xl font-semibold text-indigo-600">0%</div>
                </div>

                <div id="result-message" class="mb-8 px-4 text-slate-700 italic"></div>
                
                <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-lg transition-colors shadow-md">
                    Try Again
                </button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "1. A 72-year-old male is sitting upright and leaning forward. He is anxious, has a respiratory rate of 30/min, and has audible wheezing. He is alert and able to answer questions in complete sentences. His oxygen saturation is 88% on room air. What is the most appropriate initial intervention?",
                options: [
                    "Begin BVM ventilation",
                    "Apply a nonrebreather mask with oxygen",
                    "Assist ventilations immediately",
                    "Place the patient supine"
                ],
                answer: 1, // B
                explanation: "The patient has respiratory distress but is ventilating adequately. Oxygen supplementation is appropriate. BVM is indicated for inadequate ventilation."
            },
            {
                q: "2. A patient with a history of opioid use is found unconscious. Respirations are 6/min and shallow. The patient's oxygen saturation is 90%. What is the priority treatment?",
                options: [
                    "Apply CPAP",
                    "Obtain a SAMPLE history",
                    "Assist ventilations with a BVM",
                    "Apply a nasal cannula"
                ],
                answer: 2, // C
                explanation: "The problem is ventilation failure. The patient cannot move enough air, requiring positive pressure ventilation."
            },
            {
                q: "3. A patient with severe asthma is struggling to breathe. He is sitting upright, using accessory muscles, and speaking only one-word sentences. Lung sounds are barely audible. This finding most strongly indicates:",
                options: [
                    "Mild respiratory distress",
                    "Improving respiratory status",
                    "Respiratory failure",
                    "Anxiety-related breathing"
                ],
                answer: 2, // C
                explanation: "A 'silent chest' and inability to speak indicate severe airflow obstruction and possible respiratory failure."
            },
            {
                q: "4. You are treating a patient with respiratory distress. The patient is awake, follows commands, and has severe shortness of breath. The patient asks if you can help them breathe easier. Which treatment should be considered?",
                options: [
                    "CPAP",
                    "BVM ventilation",
                    "Suctioning",
                    "Oral airway insertion"
                ],
                answer: 0, // A
                explanation: "CPAP is appropriate for alert patients with respiratory distress who can maintain their airway."
            },
            {
                q: "5. Which patient is the best candidate for CPAP?",
                options: [
                    "A patient who is unconscious with slow breathing",
                    "A patient with facial trauma and vomiting",
                    "A patient with pulmonary edema who is alert and breathing adequately",
                    "A patient who cannot follow commands"
                ],
                answer: 2, // C
                explanation: "CPAP requires an alert patient who can protect their airway."
            },
            {
                q: "6. A patient has a respiratory rate of 8/min with shallow chest rise. Which finding is most concerning?",
                options: [
                    "Mild anxiety",
                    "Ability to speak clearly",
                    "Inadequate ventilation",
                    "Increased appetite"
                ],
                answer: 2, // C
                explanation: "Slow, shallow respirations indicate ventilation failure."
            },
            {
                q: "7. You arrive at a scene and hear loud snoring coming from an unconscious patient. What does this most likely indicate?",
                options: [
                    "Lower airway narrowing",
                    "Tongue obstruction",
                    "Pulmonary edema",
                    "Fluid in the lungs"
                ],
                answer: 1, // B
                explanation: "Snoring respirations commonly indicate partial airway obstruction from the tongue."
            },
            {
                q: "8. A patient has gurgling respirations after a seizure. What is the EMT's priority action?",
                options: [
                    "Apply CPAP",
                    "Obtain a medical history",
                    "Suction the airway",
                    "Apply a nasal cannula"
                ],
                answer: 2, // C
                explanation: "Gurgling indicates fluid or secretions obstructing the airway."
            },
            {
                q: "9. A patient is breathing 24 times per minute and has an oxygen saturation of 86%. They are alert and speaking normally. Which statement is most accurate?",
                options: [
                    "The patient has adequate ventilation but poor oxygenation",
                    "The patient requires immediate BVM ventilation",
                    "The patient is not experiencing respiratory compromise",
                    "The patient cannot protect their airway"
                ],
                answer: 0, // A
                explanation: "The patient is moving air but oxygen exchange is impaired."
            },
            {
                q: "10. A patient receiving oxygen through a nonrebreather mask remains confused and has shallow respirations. What should the EMT do next?",
                options: [
                    "Increase oxygen flow rate",
                    "Switch to nasal cannula",
                    "Begin assisted ventilations",
                    "Remove oxygen therapy"
                ],
                answer: 2, // C
                explanation: "Confusion and shallow breathing suggest ventilation failure. Oxygen alone will not fix inadequate ventilation."
            },
            {
                q: "11. A patient with COPD is experiencing increased shortness of breath. He is alert, sitting upright, and has increased work of breathing. Which intervention is appropriate?",
                options: [
                    "Force the patient to lie flat",
                    "Consider CPAP if allowed by protocol",
                    "Insert an airway adjunct immediately",
                    "Begin chest compressions"
                ],
                answer: 1, // B
                explanation: "CPAP may improve ventilation and oxygen exchange in appropriate COPD patients."
            },
            {
                q: "12. A patient has respiratory distress and is becoming tired. Which finding suggests progression toward respiratory failure?",
                options: [
                    "Speaking clearly",
                    "Decreased mental status",
                    "Mild anxiety",
                    "Increased respiratory effort only"
                ],
                answer: 1, // B
                explanation: "Altered mental status is a major sign of respiratory failure."
            },
            {
                q: "13. Which patient requires immediate BVM ventilation?",
                options: [
                    "Patient with wheezing and anxiety",
                    "Patient with SpO₂ of 91% who is alert",
                    "Patient breathing 4 times/min with poor chest rise",
                    "Patient requesting oxygen"
                ],
                answer: 2, // C
                explanation: "Inadequate breathing requires assisted ventilation."
            },
            {
                q: "14. A patient is found after a house fire. They have facial burns, soot around the mouth, and a hoarse voice. What should concern the EMT most?",
                options: [
                    "Possible airway swelling",
                    "Mild skin irritation",
                    "Need for oral fluids",
                    "Anxiety"
                ],
                answer: 0, // A
                explanation: "Inhalation injuries can rapidly compromise the airway."
            },
            {
                q: "15. A patient has difficulty breathing and is using accessory muscles. Which assessment finding is most important in determining whether BVM ventilation is needed?",
                options: [
                    "Patient's age",
                    "Respiratory effort and mental status",
                    "Patient's insurance status",
                    "Time of symptom onset only"
                ],
                answer: 1, // B
                explanation: "Ventilation decisions depend on whether the patient can adequately breathe and protect the airway."
            },
            {
                q: "16. You are ventilating an adult patient with a BVM. What is the correct ventilation rate?",
                options: [
                    "1 breath every 2 seconds",
                    "1 breath every 4 seconds",
                    "1 breath every 6 seconds",
                    "30 breaths per minute"
                ],
                answer: 2, // C
                explanation: "Adult rescue ventilation is approximately 10 breaths/min (1 every 6 seconds)."
            },
            {
                q: "17. A patient with pulmonary edema is severely short of breath. They are awake and following commands but cannot tolerate lying down. What is the best position?",
                options: [
                    "Supine",
                    "Recovery position",
                    "Position of comfort, usually upright",
                    "Trendelenburg position"
                ],
                answer: 2, // C
                explanation: "Patients with respiratory distress often breathe better sitting upright."
            },
            {
                q: "18. A patient with respiratory distress refuses CPAP because they feel uncomfortable wearing the mask. What should the EMT do?",
                options: [
                    "Force the mask onto the patient",
                    "Respect the refusal and provide appropriate care within protocol",
                    "Sedate the patient",
                    "Leave the patient alone"
                ],
                answer: 1, // B
                explanation: "Patients must participate in care when alert and capable of decision-making."
            },
            {
                q: "19. A patient has severe respiratory distress. Which assessment finding indicates the patient is deteriorating?",
                options: [
                    "Respiratory rate decreases from 34 to 10/min with worsening mental status",
                    "Patient reports feeling anxious",
                    "Patient requests to sit upright",
                    "Patient has mild wheezing"
                ],
                answer: 0, // A
                explanation: "A falling respiratory rate in an exhausted patient can indicate impending respiratory failure."
            },
            {
                q: "20. You arrive at a patient with difficulty breathing. Which action should occur first?",
                options: [
                    "Determine the patient's medication history",
                    "Assess airway and breathing",
                    "Obtain a detailed medical history",
                    "Measure blood glucose"
                ],
                answer: 1, // B
                explanation: "Airway and breathing are immediate life threats and are assessed before secondary information."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options');
        const questionNumber = document.getElementById('question-number');
        const scoreDisplay = document.getElementById('score-display');
        const feedback = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackStatus = document.getElementById('feedback-status');
        const feedbackIcon = document.getElementById('feedback-icon');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress');

        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestion];
            
            // Reset UI
            feedback.classList.add('hidden');
            nextBtn.classList.add('hidden');
            optionsContainer.innerHTML = '';
            
            // Set Text
            questionNumber.innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
            questionText.innerText = q.q;
            progressBar.style.width = `${((currentQuestion) / questions.length) * 100}%`;

            // Create Options
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-lg border-2 border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 transition-all font-medium text-slate-700 flex items-start";
                btn.innerHTML = `<span class="bg-slate-100 text-slate-500 w-6 h-6 rounded-full inline-flex items-center justify-center mr-3 flex-shrink-0 text-xs">${String.fromCharCode(65 + index)}</span> <span>${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, clickedBtn) {
            if (answered) return;
            answered = true;

            const correct = questions[currentQuestion].answer;
            const allBtns = optionsContainer.querySelectorAll('button');

            if (selectedIndex === correct) {
                score++;
                scoreDisplay.innerText = `Score: ${score}`;
                clickedBtn.classList.replace('border-slate-200', 'border-green-500');
                clickedBtn.classList.add('bg-green-50');
                showFeedback(true);
            } else {
                clickedBtn.classList.replace('border-slate-200', 'border-red-500');
                clickedBtn.classList.add('bg-red-50');
                allBtns[correct].classList.replace('border-slate-200', 'border-green-500');
                allBtns[correct].classList.add('bg-green-50');
                showFeedback(false);
            }

            allBtns.forEach(btn => btn.disabled = true);
            nextBtn.classList.remove('hidden');
            
            if (currentQuestion === questions.length - 1) {
                nextBtn.innerText = "See Results";
            }
        }

        function showFeedback(isCorrect) {
            feedback.classList.remove('hidden');
            if (isCorrect) {
                feedback.classList.add('bg-green-50', 'border-green-100');
                feedback.classList.remove('bg-red-50', 'border-red-100');
                feedbackStatus.innerText = "Correct";
                feedbackStatus.className = "font-bold text-sm uppercase text-green-700";
                feedbackIcon.innerText = "✓";
                feedbackIcon.className = "mr-2 font-bold text-green-700";
            } else {
                feedback.classList.add('bg-red-50', 'border-red-100');
                feedback.classList.remove('bg-green-50', 'border-green-100');
                feedbackStatus.innerText = "Incorrect";
                feedbackStatus.className = "font-bold text-sm uppercase text-red-700";
                feedbackIcon.innerText = "✗";
                feedbackIcon.className = "mr-2 font-bold text-red-700";
            }
            feedbackText.innerText = questions[currentQuestion].explanation;
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            document.getElementById('question-box').classList.add('hidden');
            const resultsBox = document.getElementById('results-box');
            resultsBox.classList.remove('hidden');
            progressBar.style.width = '100%';

            const finalScore = document.getElementById('final-score');
            const percentage = document.getElementById('percentage');
            const message = document.getElementById('result-message');

            const percent = Math.round((score / questions.length) * 100);
            finalScore.innerText = `${score}/${questions.length}`;
            percentage.innerText = `${percent}%`;

            if (percent >= 85) {
                message.innerText = "Outstanding! You have a solid grasp of Level 3+ Airway, Respiration, and Ventilation decision-making.";
            } else if (percent >= 70) {
                message.innerText = "Good job! Review the distinction between oxygenation (NRB) and ventilation (BVM) priorities for tricky clinical scenarios.";
            } else {
                message.innerText = "Keep practicing! Re-check core indications for CPAP, BVM vs. NRB, and signs of transition from respiratory distress to failure.";
            }
        }

        // Initialize
        loadQuestion();
    </script>
</body>
</html>
