<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NREMT Respiratory Practice Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
        <!-- Header (Teal Theme) -->
        <div class="bg-teal-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Respiratory Practice</h1>
            <p class="text-teal-100 text-sm mt-1">NREMT Practice Questions: Respiratory Emergencies</p>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2">
            <div id="progress" class="bg-teal-500 h-2 transition-all duration-500" style="width: 0%"></div>
        </div>

        <div id="quiz-container" class="p-6">
            <!-- Question Section -->
            <div id="question-box" class="fade-in">
                <div class="flex justify-between items-center mb-4">
                    <span id="question-number" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Question 1 of 20</span>
                    <span id="score-display" class="text-xs font-bold text-teal-700 bg-teal-50 px-2 py-1 rounded">Score: 0</span>
                </div>
                
                <h2 id="question-text" class="text-lg font-semibold text-slate-800 mb-6 leading-snug">
                    Loading question...
                </h2>

                <div id="options" class="space-y-3">
                    <!-- Options injected here -->
                </div>

                <!-- Feedback Section (Hidden by default) -->
                <div id="feedback" class="mt-6 p-4 rounded-lg hidden border">
                    <div class="flex items-center mb-2">
                        <span id="feedback-icon" class="mr-2 font-bold"></span>
                        <span id="feedback-status" class="font-bold text-sm uppercase"></span>
                    </div>
                    <p id="feedback-text" class="text-sm text-slate-600 italic"></p>
                </div>

                <!-- Navigation -->
                <button id="next-btn" class="mt-8 w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-6 rounded-lg transition-colors hidden shadow-md">
                    Next Question
                </button>
            </div>

            <!-- Results Section (Hidden by default) -->
            <div id="results-box" class="hidden text-center py-10 fade-in">
                <div class="text-6xl mb-4">🫁</div>
                <h2 class="text-3xl font-bold text-slate-800 mb-2">Quiz Complete!</h2>
                <p class="text-slate-500 mb-6">You've finished the Respiratory Emergencies assessment.</p>
                
                <div class="inline-block p-8 bg-teal-50 rounded-2xl mb-8 border border-teal-100">
                    <div id="final-score" class="text-5xl font-bold text-teal-700 mb-2">0/20</div>
                    <div id="percentage" class="text-xl font-semibold text-teal-600">0%</div>
                </div>

                <div id="result-message" class="mb-8 px-4 text-slate-700 italic"></div>
                
                <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-lg transition-colors shadow-md">
                    Try Again
                </button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "1. A 68-year-old male with a history of COPD is sitting upright and using accessory muscles to breathe. He is anxious and can only speak in two-word sentences. His SpO₂ is 86% on room air. What should the EMT do FIRST?",
                options: [
                    "Apply oxygen and reassess the patient's respiratory effort",
                    "Place the patient supine for a complete assessment",
                    "Obtain a detailed medical history",
                    "Assist the patient with his prescribed inhaler"
                ],
                answer: 0, // A
                explanation: "The priority for a hypoxic patient in severe respiratory distress is oxygen administration to restore adequate oxygenation before further assessment or treatments."
            },
            {
                q: "2. A patient with asthma suddenly becomes quiet, has minimal air movement, and is no longer wheezing. Which finding is MOST concerning?",
                options: [
                    "Anxiety and restlessness",
                    "Absence of wheezing with severe distress",
                    "Increased respiratory rate",
                    "Decreased ability to speak"
                ],
                answer: 1, // B
                explanation: "A 'silent chest' indicates severe airway obstruction and impending respiratory failure; absence of wheezing in severe distress means very little air is moving."
            },
            {
                q: "3. A patient with suspected pulmonary edema is sitting upright, coughing pink frothy sputum, and struggling to breathe. Which intervention is MOST appropriate?",
                options: [
                    "Give oral fluids to thin secretions",
                    "Assist ventilations with a bag-mask device immediately",
                    "Administer oxygen and place the patient in a position of comfort",
                    "Encourage the patient to lie flat"
                ],
                answer: 2, // C
                explanation: "Proper position (upright) and oxygenation reduce cardiac preload and support breathing in pulmonary edema; lying flat worsens fluid accumulation in the lungs."
            },
            {
                q: "4. A 55-year-old patient complains of sudden sharp chest pain and difficulty breathing after a long flight. The patient is tachycardic and anxious. Which condition should the EMT suspect?",
                options: [
                    "Bronchitis",
                    "Pneumonia",
                    "Hyperventilation syndrome",
                    "Pulmonary embolism"
                ],
                answer: 3, // D
                explanation: "Sudden onset chest pain and dyspnea after prolonged immobility (e.g., long flight) are classic indicators of a pulmonary embolism."
            },
            {
                q: "5. A patient is breathing 8 times per minute with shallow respirations after taking opioids. His oxygen saturation is 82%. What is the EMT's priority?",
                options: [
                    "Obtain a medication history",
                    "Assist ventilations with a bag-mask device",
                    "Administer oral glucose",
                    "Place the patient in a recovery position"
                ],
                answer: 1, // B
                explanation: "Inadequate rate and depth with severe hypoxia require immediate positive-pressure ventilation support via bag-mask device."
            },
            {
                q: "6. A patient with COPD asks why the EMT is administering oxygen when they have been told not to receive \"too much oxygen.\" Which response is MOST appropriate?",
                options: [
                    "\"Oxygen will worsen your COPD immediately.\"",
                    "\"We will provide oxygen based on your current condition and oxygen level.\"",
                    "\"Oxygen should never be given to COPD patients.\"",
                    "\"COPD patients do not require oxygen unless unconscious.\""
                ],
                answer: 1, // B
                explanation: "Hypoxia is a life threat; oxygen should never be withheld in emergency situations, but titrated appropriately based on clinical presentation and oxygen saturation."
            },
            {
                q: "7. A patient with asthma has used their prescribed inhaler without relief. Which finding indicates the patient is experiencing respiratory failure?",
                options: [
                    "Increasing fatigue and altered mental status",
                    "Respiratory rate of 22/min with clear speech",
                    "Ability to speak full sentences",
                    "Mild wheezing after exercise"
                ],
                answer: 0, // A
                explanation: "Altered mental status, severe fatigue, and lethargy are cardinal signs of respiratory failure and exhaustion."
            },
            {
                q: "8. A 4-year-old child has a barking cough, inspiratory stridor, and a low-grade fever. Which condition is MOST likely?",
                options: [
                    "Foreign body airway obstruction",
                    "Bronchiolitis",
                    "Croup",
                    "Asthma"
                ],
                answer: 2, // C
                explanation: "The characteristic barking cough, low-grade fever, and stridor in a young child are classic signs of croup."
            },
            {
                q: "9. A child is sitting upright, drooling, and leaning forward with difficulty breathing. You should suspect:",
                options: [
                    "Epiglottitis",
                    "Asthma exacerbation",
                    "Bronchiolitis",
                    "Pneumonia"
                ],
                answer: 0, // A
                explanation: "Drooling, tripod positioning, and acute respiratory distress in a pediatric patient strongly suggest epiglottitis."
            },
            {
                q: "10. A patient has a partial airway obstruction caused by food. The patient is coughing forcefully and can still speak. What should the EMT do?",
                options: [
                    "Begin CPR",
                    "Encourage the patient to continue coughing",
                    "Perform a blind finger sweep",
                    "Perform abdominal thrusts immediately"
                ],
                answer: 1, // B
                explanation: "If a patient with a partial obstruction can cough forcefully, encourage them to clear the airway themselves; manual interventions are reserved for complete or ineffective coughing obstructions."
            },
            {
                q: "11. A patient with pneumonia is experiencing increased work of breathing. Which assessment finding indicates deterioration?",
                options: [
                    "Respiratory rate of 18/min",
                    "Mild fever",
                    "Increasing confusion and fatigue",
                    "Productive cough"
                ],
                answer: 2, // C
                explanation: "Confusion and exhaustion signal hypoxemia/hypercapnia and transition toward respiratory failure."
            },
            {
                q: "12. A patient is hyperventilating after a stressful event. Before assuming anxiety, the EMT should:",
                options: [
                    "Ignore the patient's symptoms",
                    "Restrict oxygen administration",
                    "Tell the patient to breathe into a paper bag",
                    "Determine if a medical cause is present"
                ],
                answer: 3, // D
                explanation: "Hyperventilation can be secondary to serious medical conditions like acidosis, hypoxia, or pulmonary embolism; underlying medical causes must be ruled out."
            },
            {
                q: "13. A patient with suspected tension pneumothorax is rapidly deteriorating. Which finding is MOST concerning?",
                options: [
                    "Severe respiratory distress with absent breath sounds on one side",
                    "Productive cough with fever",
                    "Equal breath sounds bilaterally",
                    "Slow pulse and hypertension"
                ],
                answer: 0, // A
                explanation: "Unilateral absent breath sounds combined with severe distress are classic indicators of a pneumothorax/tension pneumothorax."
            },
            {
                q: "14. A patient with a tracheostomy is having difficulty breathing. Which action should the EMT consider FIRST?",
                options: [
                    "Give the patient food or water",
                    "Remove the tracheostomy tube",
                    "Assess the airway and check for obstruction",
                    "Place the patient flat on their back"
                ],
                answer: 2, // C
                explanation: "Tracheostomy trouble usually stems from tube obstruction (mucus plug) or displacement; assessing and clearing the airway is the first priority."
            },
            {
                q: "15. A patient is breathing rapidly and deeply with fruity-smelling breath and altered mental status. Which condition should be suspected?",
                options: [
                    "Opioid overdose",
                    "Diabetic ketoacidosis",
                    "Pulmonary edema",
                    "Asthma attack"
                ],
                answer: 1, // B
                explanation: "Kussmaul respirations (deep, rapid breathing) and a fruity odor on the breath are textbook signs of diabetic ketoacidosis (DKA)."
            },
            {
                q: "16. A patient with severe respiratory distress has a respiratory rate of 36/min, weak chest movement, and decreasing consciousness. Which intervention is indicated?",
                options: [
                    "Assist ventilations with a bag-mask device",
                    "Obtain a complete SAMPLE history",
                    "Allow the patient to rest",
                    "Encourage slow breathing"
                ],
                answer: 0, // A
                explanation: "Inadequate tidal volume (weak chest movement) along with altered consciousness requires immediate assisted ventilation."
            },
            {
                q: "17. A patient with a history of asthma has wheezing and difficulty breathing. Which medication may the EMT assist with if allowed by protocol?",
                options: [
                    "Nitroglycerin",
                    "Aspirin",
                    "Albuterol inhaler",
                    "Epinephrine auto-injector only"
                ],
                answer: 2, // C
                explanation: "Albuterol is a selective beta-2 agonist bronchodilator commonly prescribed for asthma management."
            },
            {
                q: "18. A patient is found unconscious after suspected opioid use. The patient has slow, shallow breathing and pinpoint pupils. What is the priority treatment?",
                options: [
                    "Perform abdominal thrusts",
                    "Administer naloxone if authorized and support ventilation",
                    "Give oxygen only and wait",
                    "Place the patient in a seated position"
                ],
                answer: 1, // B
                explanation: "Opioid toxicity causes severe respiratory depression; ventilatory support combined with naloxone (when authorized) directly treats the underlying life threat."
            },
            {
                q: "19. A patient with chest trauma has severe shortness of breath and one side of the chest is not moving normally. What should the EMT suspect?",
                options: [
                    "Bronchitis",
                    "Hyperventilation syndrome",
                    "Pneumothorax",
                    "Asthma"
                ],
                answer: 2, // C
                explanation: "Chest trauma with asymmetrical chest wall movement and shortness of breath strongly points toward a pneumothorax or flail segment."
            },
            {
                q: "20. During assessment of a respiratory patient, which finding indicates the patient is progressing from respiratory distress to respiratory failure?",
                options: [
                    "Mild anxiety",
                    "Increased respiratory effort",
                    "Ability to answer questions clearly",
                    "Decreasing level of consciousness"
                ],
                answer: 3, // D
                explanation: "Depressed mental status reflects severe brain hypoxia and exhaustion, signaling the transition from compensation (distress) to decompensation (failure)."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options');
        const questionNumber = document.getElementById('question-number');
        const scoreDisplay = document.getElementById('score-display');
        const feedback = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackStatus = document.getElementById('feedback-status');
        const feedbackIcon = document.getElementById('feedback-icon');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress');

        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestion];
            
            // Reset UI
            feedback.classList.add('hidden');
            nextBtn.classList.add('hidden');
            optionsContainer.innerHTML = '';
            
            // Set Text
            questionNumber.innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
            questionText.innerText = q.q;
            progressBar.style.width = `${((currentQuestion) / questions.length) * 100}%`;

            // Create Options
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-lg border-2 border-slate-200 hover:border-teal-300 hover:bg-teal-50 transition-all font-medium text-slate-700 flex items-start";
                btn.innerHTML = `<span class="bg-slate-100 text-slate-500 w-6 h-6 rounded-full inline-flex items-center justify-center mr-3 flex-shrink-0 text-xs">${String.fromCharCode(65 + index)}</span> <span>${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, clickedBtn) {
            if (answered) return;
            answered = true;

            const correct = questions[currentQuestion].answer;
            const allBtns = optionsContainer.querySelectorAll('button');

            if (selectedIndex === correct) {
                score++;
                scoreDisplay.innerText = `Score: ${score}`;
                clickedBtn.classList.replace('border-slate-200', 'border-green-500');
                clickedBtn.classList.add('bg-green-50');
                showFeedback(true);
            } else {
                clickedBtn.classList.replace('border-slate-200', 'border-red-500');
                clickedBtn.classList.add('bg-red-50');
                allBtns[correct].classList.replace('border-slate-200', 'border-green-500');
                allBtns[correct].classList.add('bg-green-50');
                showFeedback(false);
            }

            allBtns.forEach(btn => btn.disabled = true);
            nextBtn.classList.remove('hidden');
            
            if (currentQuestion === questions.length - 1) {
                nextBtn.innerText = "See Results";
            }
        }

        function showFeedback(isCorrect) {
            feedback.classList.remove('hidden');
            if (isCorrect) {
                feedback.classList.add('bg-green-50', 'border-green-100');
                feedback.classList.remove('bg-red-50', 'border-red-100');
                feedbackStatus.innerText = "Correct";
                feedbackStatus.className = "font-bold text-sm uppercase text-green-700";
                feedbackIcon.innerText = "✓";
                feedbackIcon.className = "mr-2 font-bold text-green-700";
            } else {
                feedback.classList.add('bg-red-50', 'border-red-100');
                feedback.classList.remove('bg-green-50', 'border-green-100');
                feedbackStatus.innerText = "Incorrect";
                feedbackStatus.className = "font-bold text-sm uppercase text-red-700";
                feedbackIcon.innerText = "✗";
                feedbackIcon.className = "mr-2 font-bold text-red-700";
            }
            feedbackText.innerText = questions[currentQuestion].explanation;
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            document.getElementById('question-box').classList.add('hidden');
            const resultsBox = document.getElementById('results-box');
            resultsBox.classList.remove('hidden');
            progressBar.style.width = '100%';

            const finalScore = document.getElementById('final-score');
            const percentage = document.getElementById('percentage');
            const message = document.getElementById('result-message');

            const percent = Math.round((score / questions.length) * 100);
            finalScore.innerText = `${score}/${questions.length}`;
            percentage.innerText = `${percent}%`;

            if (percent >= 85) {
                message.innerText = "Excellent! You have a strong grasp of NREMT respiratory emergencies. You're well-prepared for this section!";
            } else if (percent >= 70) {
                message.innerText = "Good job! Review the questions you missed, especially paying attention to differentiation between respiratory distress and failure.";
            } else {
                message.innerText = "Keep studying! Focus on key signs of pediatric airway emergencies, lung sounds, and immediate oxygenation vs ventilation priorities.";
            }
        }

        // Initialize
        loadQuestion();
    </script>
</body>
</html>
