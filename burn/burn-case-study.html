<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NREMT Progressive Case Studies: Burn Emergencies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-indigo-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Progressive Case Studies</h1>
            <p class="text-indigo-100 text-sm mt-1">NREMT Clinical Reasoning: Burn Emergencies</p>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2">
            <div id="progress" class="bg-indigo-500 h-2 transition-all duration-500" style="width: 0%"></div>
        </div>

        <div id="quiz-container" class="p-6">
            <!-- Question Section -->
            <div id="question-box" class="fade-in">
                <div class="flex justify-between items-center mb-4">
                    <span id="question-number" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Case 1 of 2</span>
                    <span id="score-display" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">Score: 0</span>
                </div>
                
                <div id="case-title" class="text-sm font-bold text-indigo-600 uppercase tracking-wide mb-1"></div>
                <div id="scenario-text" class="bg-slate-50 p-4 rounded-lg border border-slate-200 text-slate-700 text-sm mb-4 whitespace-pre-line"></div>

                <h2 id="question-text" class="text-base font-semibold text-slate-800 mb-4 leading-snug">
                    Loading question...
                </h2>

                <div id="options" class="space-y-3">
                    <!-- Options injected here -->
                </div>

                <!-- Feedback Section (Hidden by default) -->
                <div id="feedback" class="mt-6 p-4 rounded-lg hidden border">
                    <div class="flex items-center mb-2">
                        <span id="feedback-icon" class="mr-2 font-bold"></span>
                        <span id="feedback-status" class="font-bold text-sm uppercase"></span>
                    </div>
                    <p id="feedback-text" class="text-sm text-slate-600 italic"></p>
                </div>

                <!-- Navigation -->
                <button id="next-btn" class="mt-8 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition-colors hidden shadow-md">
                    Next Step
                </button>
            </div>

            <!-- Results Section (Hidden by default) -->
            <div id="results-box" class="hidden text-center py-10 fade-in">
                <div class="text-6xl mb-4">🔥</div>
                <h2 class="text-3xl font-bold text-slate-800 mb-2">Case Studies Complete!</h2>
                <p class="text-slate-500 mb-6">You've finished the NREMT Progressive Case Studies assessment.</p>
                
                <div class="inline-block p-8 bg-indigo-50 rounded-2xl mb-8 border border-indigo-100">
                    <div id="final-score" class="text-5xl font-bold text-indigo-700 mb-2">0/6</div>
                    <div id="percentage" class="text-xl font-semibold text-indigo-500">0%</div>
                </div>

                <div id="result-message" class="mb-8 px-4 text-slate-700 italic"></div>
                
                <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-lg transition-colors shadow-md">
                    Try Again
                </button>
            </div>
        </div>
    </div>

    <script>
        const stages = [
            {
                caseTitle: "Progressive Case Study 1: Residential House Fire (Part 1)",
                scenario: "Scenario – Part 1:\nYou are dispatched to a residential house fire. Firefighters have removed a 42-year-old male from the living room. He is sitting upright and appears anxious. He has burns to his face, neck, and both forearms. His clothing has been extinguished.\n\nAssessment:\n• Awake and alert\n• Speaking in short sentences\n• Respiratory rate: 24/min\n• Pulse: 118/min\n• BP: 132/84 mmHg\n• SpO₂: 95% on room air\n• Soot is visible around his mouth and nostrils.\n• Singed nasal hairs are present.",
                question: "What is your highest priority?",
                options: [
                    "Determine the total body surface area burned.",
                    "Cover all burns with dry sterile dressings.",
                    "Assess and manage the airway because of suspected inhalation injury.",
                    "Apply burn ointment to reduce pain."
                ],
                answer: 2,
                explanation: "Facial burns, soot, and singed nasal hairs strongly suggest inhalation injury. Airway swelling may progress rapidly, making airway assessment and oxygen administration the immediate priority."
            },
            {
                caseTitle: "Progressive Case Study 1: Residential House Fire (Part 2)",
                scenario: "Scenario – Part 2:\nFive minutes later, the patient develops a hoarse voice and audible stridor.\n\nVital signs:\n• RR: 32/min\n• Pulse: 126/min\n• SpO₂: 90% despite oxygen via nonrebreather",
                question: "What should the EMT do next?",
                options: [
                    "Continue transporting without changing treatment.",
                    "Assist ventilations with a bag-mask device if breathing becomes inadequate and request ALS if not already responding.",
                    "Remove all dressings and cool the burns.",
                    "Delay transport until additional firefighters arrive."
                ],
                answer: 1,
                explanation: "Progressive airway edema can rapidly obstruct the airway. Oxygen should continue, ventilation should be assisted if necessary, and ALS should be requested early."
            },
            {
                caseTitle: "Progressive Case Study 1: Residential House Fire (Part 3)",
                scenario: "Scenario – Part 3:\nThe patient's burns include:\n• Entire face\n• Entire anterior right arm\n• Partial burns to the upper chest",
                question: "Based on this presentation, which statement is MOST appropriate?",
                options: [
                    "The patient is a candidate for evaluation at a burn center because of facial burns and suspected inhalation injury.",
                    "The burns are minor because they involve less than 10% TBSA.",
                    "Only pain management is required during transport.",
                    "Transport to the closest urgent care center."
                ],
                answer: 0,
                explanation: "Burns involving the face and suspected inhalation injuries are indications for transport to a burn center whenever feasible."
            },
            {
                caseTitle: "Progressive Case Study 2: Electrical Injury at a Construction Site (Part 1)",
                scenario: "Scenario – Part 1:\nYou respond to a construction site where a 29-year-old electrician has contacted a 240-volt electrical circuit.\nWhen you arrive, coworkers are yelling that he is still touching the wire.",
                question: "What is your FIRST action?",
                options: [
                    "Pull the patient away from the wire.",
                    "Shut off or ensure the electrical source has been disconnected before approaching.",
                    "Begin CPR immediately.",
                    "Spray the patient with water to cool the burns."
                ],
                answer: 1,
                explanation: "Scene safety is the first priority. Never touch a patient until the electrical source has been secured."
            },
            {
                caseTitle: "Progressive Case Study 2: Electrical Injury at a Construction Site (Part 2)",
                scenario: "Scenario – Part 2:\nPower has been disconnected.\nThe patient is now lying on the ground.\n\nAssessment:\n• Unresponsive\n• Breathing: absent\n• Pulse: present at 56/min\n• Small entrance wound on the right hand\n• Small exit wound on the left foot",
                question: "What should the EMT do next?",
                options: [
                    "Begin chest compressions.",
                    "Apply dry sterile dressings before assessing breathing.",
                    "Begin bag-mask ventilations with high-concentration oxygen.",
                    "Immediately transport without treatment."
                ],
                answer: 2,
                explanation: "The patient has respiratory arrest but still has a pulse. Ventilation is the priority."
            },
            {
                caseTitle: "Progressive Case Study 2: Electrical Injury at a Construction Site (Part 3)",
                scenario: "Scenario – Part 3:\nAfter several minutes of assisted ventilations, the patient begins breathing spontaneously but remains confused. Cardiac monitoring by ALS reveals ventricular ectopy.",
                question: "Which statement best explains the patient's condition?",
                options: [
                    "Electrical injuries may produce significant internal tissue and cardiac damage despite minimal external burns.",
                    "The small entrance wound indicates only a minor injury.",
                    "Burn severity is determined only by the size of visible burns.",
                    "Electrical burns rarely affect the heart."
                ],
                answer: 0,
                explanation: "Electrical current can travel through deep tissues, causing muscle injury, dysrhythmias, and internal damage that is far greater than the visible skin injury. This reflects a key NREMT principle: do not underestimate electrical injuries based on external appearance alone."
            }
        ];

        let currentStage = 0;
        let score = 0;
        let answered = false;

        const caseTitle = document.getElementById('case-title');
        const scenarioText = document.getElementById('scenario-text');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options');
        const questionNumber = document.getElementById('question-number');
        const scoreDisplay = document.getElementById('score-display');
        const feedback = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackStatus = document.getElementById('feedback-status');
        const feedbackIcon = document.getElementById('feedback-icon');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress');

        function loadStage() {
            answered = false;
            const stage = stages[currentStage];
            
            feedback.classList.add('hidden');
            nextBtn.classList.add('hidden');
            optionsContainer.innerHTML = '';
            
            questionNumber.innerText = `Step ${currentStage + 1} of ${stages.length}`;
            caseTitle.innerText = stage.caseTitle;
            scenarioText.innerText = stage.scenario;
            questionText.innerText = stage.question;
            progressBar.style.width = `${((currentStage) / stages.length) * 100}%`;

            stage.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-lg border-2 border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 transition-all font-medium text-slate-700 flex items-start";
                btn.innerHTML = `<span class="bg-slate-100 text-slate-500 w-6 h-6 rounded-full inline-flex items-center justify-center mr-3 flex-shrink-0 text-xs">${String.fromCharCode(65 + index)}</span> <span>${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, clickedBtn) {
            if (answered) return;
            answered = true;

            const correct = stages[currentStage].answer;
            const allBtns = optionsContainer.querySelectorAll('button');

            if (selectedIndex === correct) {
                score++;
                scoreDisplay.innerText = `Score: ${score}`;
                clickedBtn.classList.replace('border-slate-200', 'border-green-500');
                clickedBtn.classList.add('bg-green-50');
                showFeedback(true);
            } else {
                clickedBtn.classList.replace('border-slate-200', 'border-red-500');
                clickedBtn.classList.add('bg-red-50');
                allBtns[correct].classList.replace('border-slate-200', 'border-green-500');
                allBtns[correct].classList.add('bg-green-50');
                showFeedback(false);
            }

            allBtns.forEach(btn => btn.disabled = true);
            nextBtn.classList.remove('hidden');
            
            if (currentStage === stages.length - 1) {
                nextBtn.innerText = "See Results";
            }
        }

        function showFeedback(isCorrect) {
            feedback.classList.remove('hidden');
            if (isCorrect) {
                feedback.classList.add('bg-green-50', 'border-green-100');
                feedback.classList.remove('bg-red-50', 'border-red-100');
                feedbackStatus.innerText = "Correct";
                feedbackStatus.className = "font-bold text-sm uppercase text-green-700";
                feedbackIcon.innerText = "✓";
                feedbackIcon.className = "mr-2 font-bold text-green-700";
            } else {
                feedback.classList.add('bg-red-50', 'border-red-100');
                feedback.classList.remove('bg-green-50', 'border-green-100');
                feedbackStatus.innerText = "Incorrect";
                feedbackStatus.className = "font-bold text-sm uppercase text-red-700";
                feedbackIcon.innerText = "✗";
                feedbackIcon.className = "mr-2 font-bold text-red-700";
            }
            feedbackText.innerText = stages[currentStage].explanation;
        }

        nextBtn.onclick = () => {
            currentStage++;
            if (currentStage < stages.length) {
                loadStage();
            } else {
                showResults();
            }
        };

        function showResults() {
            document.getElementById('question-box').classList.add('hidden');
            const resultsBox = document.getElementById('results-box');
            resultsBox.classList.remove('hidden');
            progressBar.style.width = '100%';

            const finalScore = document.getElementById('final-score');
            const percentage = document.getElementById('percentage');
            const message = document.getElementById('result-message');

            const percent = Math.round((score / stages.length) * 100);
            finalScore.innerText = `${score}/${stages.length}`;
            percentage.innerText = `${percent}%`;

            if (percent >= 85) {
                message.innerText = "Outstanding clinical reasoning! You successfully navigated complex progressive airway, electrical, and thermal burn scenarios.";
            } else if (percent >= 70) {
                message.innerText = "Good job! Review the progressive steps you missed, paying close attention to inhalation deterioration patterns and electrical hazard priorities.";
            } else {
                message.innerText = "Keep practicing! Revisit core burn case protocols focusing on scene safety, early airway interventions, and systemic complications.";
            }
        }

        loadStage();
    </script>
</body>
</html>
