<body>

    <header>

    <script>
        const cases = {
            1: {
                title: "Case Study 1: Thermal Burn With Airway Threat",
                phases: [
                    {
                        phaseTitle: "Phase 1: Dispatch / Scene Size-Up",
                        scenario: `<p><strong>Dispatch:</strong> House fire for a 45-year-old male rescued from a bedroom.</p>
                                   <p><strong>Fire Department Report:</strong> Patient found unconscious inside the room, exposed to smoke for ~10 minutes. Has burns to face, chest, and arms. Scene is now declared safe.</p>

                        question: "1. During the scene size-up, which finding should raise the greatest concern?",
                        options: [

                            "B. The patient was exposed to smoke in an enclosed space",
                            "C. The patient is complaining of pain",

                        ],
                        correctIndex: 1,
                        rationale: "An enclosed-space fire exposure suggests possible inhalation injury. Airway compromise may develop rapidly due to swelling.",
                        nremtPrinciple: "NREMT Principle: Identify hidden life threats based on mechanism."
                    },
                    {
                        phaseTitle: "Phase 2: Primary Assessment",
                        scenario: `<p><strong>Patient Assessment Findings:</strong></p>
                                   <ul class="findings-list">
                                       <li>Alert but anxious | Hoarse voice | Singed facial hair</li>
                                       <li>Respirations: 28/min | Pulse: 118/min | SpO₂: 92%</li>
                                       <li>Skin: Burned and painful</li>
                                   </ul>`,
                        question: "2. What is the EMT's priority action?",
                        options: [
                            "A. Estimate total body surface area burned",
                            "B. Apply dry sterile dressings to the burns",
                            "C. Assess and manage the airway while providing appropriate care",
                            "D. Obtain a detailed SAMPLE history"
                        ],
                        correctIndex: 2,
                        rationale: "The patient has multiple indicators of possible airway injury: enclosed-space exposure, hoarse voice, and singed facial hair. Airway problems take priority over burn size estimation or history.",
                        nremtPrinciple: "NREMT Principle: Airway always comes before secondary concerns."
                    },
                    {
                        phaseTitle: "Phase 3: Treatment Decision",
                        scenario: `<p>The patient becomes increasingly anxious.</p>
                                   <p><strong>New Assessment Findings:</strong></p>
                                   <ul class="findings-list">
                                       <li>Increasing hoarseness</li>
                                       <li>Increased work of breathing</li>
                                       <li>Facial swelling beginning</li>
                                   </ul>`,
                        question: "3. Why is this patient considered high priority?",
                        options: [
                            "A. Burns are always considered critical regardless of location",
                            "B. Airway swelling may progress and become difficult to manage",
                            "C. Pain medications are unavailable",
                            "D. The patient requires a complete burn measurement before treatment"
                        ],
                        correctIndex: 1,
                        rationale: "Airway edema after inhalation injury can worsen quickly. Early recognition and immediate transport priority are critical.",
                        nremtPrinciple: null
                    },
                    {
                        phaseTitle: "Phase 4: Transport Decision",
                        scenario: `<p><strong>Patient Status:</strong></p>
                                   <ul class="findings-list">
                                       <li>Partial-thickness burns to the chest and arms</li>
                                       <li>Suspected inhalation injury</li>
                                       <li>Increasing respiratory difficulty</li>
                                   </ul>`,
                        question: "4. Which transport decision is most appropriate?",
                        options: [
                            "A. Delay transport until all burn measurements are completed",
                            "B. Transport rapidly to an appropriate facility while continuing care",
                            "C. Allow the patient to walk to the ambulance",
                            "D. Treat only the burns before considering transport"
                        ],
                        correctIndex: 1,
                        rationale: "Patients with airway concerns require rapid transport. Definitive burn care occurs at the hospital.",
                        nremtPrinciple: null
                    },
                    {
                        phaseTitle: "Phase 5: Reassessment",
                        scenario: `<p><strong>En Route Reassessment:</strong></p>
                                   <ul class="findings-list">
                                       <li>The patient's voice becomes weaker</li>
                                       <li>Respirations: 34/min, Labored</li>
                                   </ul>`,
                        question: "5. What should the EMT recognize?",
                        options: [
                            "A. The patient is improving because they remain conscious",
                            "B. The patient is developing worsening respiratory compromise",
                            "C. The burn severity is decreasing",
                            "D. The patient only requires additional pain management"
                        ],
                        correctIndex: 1,
                        rationale: "A weakening voice and increasing respiratory effort indicate worsening airway/respiratory status requiring continuous support.",
                        nremtPrinciple: null
                    }
                ]
            },
            2: {
                title: "Case Study 2: Electrical Burn With Hidden Injury",
                phases: [
                    {
                        phaseTitle: "Phase 1: Scene Size-Up",
                        scenario: `<p><strong>Dispatch:</strong> Construction site for a worker injured by electrical exposure.</p>
                                   <p><strong>Supervisor Statement:</strong> "He grabbed a damaged electrical cable and collapsed."</p>

                        rationale: "Electrical hazards can injure rescuers. Scene safety comes first before any assessment or care.",

                        scenario: `<p><strong>Patient Assessment Findings:</strong></p>

                            "A. Visible burn wounds",

                                   <p><strong>Reassessment Findings:</strong> Chest discomfort, Irregular pulse, Weak radial pulse.</p>`,
                        question: "3. What should the EMT do first?",
                        options: [
                            "A. Measure the burn surface area",
                            "B. Perform a detailed extremity assessment",
                            "C. Continue cardiac monitoring and treat life threats",
                            "D. Ask about the patient's tetanus vaccination"
                        ],
                        correctIndex: 2,
                        rationale: "Cardiac complications take immediate priority over burn documentation or non-urgent history.",
                        nremtPrinciple: null
                    },
                    {
                        phaseTitle: "Phase 4: Transport Decision",
                        scenario: `<p><strong>Patient Status:</strong> Electrical injury, Altered mental status, Abnormal pulse, Possible internal injury.</p>`,
                        question: "4. Which statement best describes the transport priority?",
                        options: [
                            "A. The patient can refuse transport because burns are small",
                            "B. The patient requires evaluation due to possible internal injury",
                            "C. Transport is unnecessary unless burns cover more than 50% of the body",
                            "D. Only patients with visible burns require transport"
                        ],
                        correctIndex: 1,
                        rationale: "Electrical injuries may appear minor externally while causing severe, life-threatening internal structural and cardiac damage.",
                        nremtPrinciple: null
                    },
                    {
                        phaseTitle: "Phase 5: Operations / Reassessment",
                        scenario: `<p><strong>En Route Reassessment:</strong> Patient becomes less responsive.</p>
                                   <ul class="findings-list">
                                       <li>Respirations: 8/min</li>
                                       <li>Pulse: Irregular</li>
                                       <li>Blood Pressure: Decreasing</li>
                                   </ul>`,
                        question: "5. What should guide the EMT's next action?",
                        options: [
                            "A. Complete the burn assessment before intervening",
                            "B. Reassess airway, breathing, and circulation immediately",
                            "C. Wait until arrival at the hospital",
                            "D. Focus only on the visible burns"
                        ],
                        correctIndex: 1,
                        rationale: "A changing or deteriorating patient requires immediate reassessment and management of the ABCs.",
                        nremtPrinciple: null
                    }
                ]
            }
        };

        let currentCase = 1;
        let currentPhase = 0;
        let answered = false;

        function switchCase(caseNum) {
            currentCase = caseNum;
            currentPhase = 0;
            answered = false;

            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === caseNum);
            });

            renderPhase();
        }

        function renderPhase() {
            const card = document.getElementById('interactive-card');
            const caseData = cases[currentCase];

            if (currentPhase >= caseData.phases.length) {
                // Render completion screen
                card.innerHTML = `
                    <div class="completion-screen">
                        <h2>${caseData.title} Complete!</h2>
                        <p>You have successfully completed all 5 phases of this progressive case study.</p>
                        <button class="restart-btn" onclick="switchCase(${currentCase})">Restart Case</button>
                    </div>
                `;
                return;
            }

            const phase = caseData.phases[currentPhase];
            answered = false;

            card.innerHTML = `
                <div class="card-header">
                    <span class="phase-badge">${phase.phaseTitle}</span>
                    <span class="progress-text">Question ${currentPhase + 1} of ${caseData.phases.length}</span>
                </div>

                <div class="scenario-box">
                    ${phase.scenario}
                </div>

                <div class="question-title">${phase.question}</div>

                <div class="options-grid">
                    ${phase.options.map((opt, i) => `
                        <button class="option-btn" id="opt-${i}" onclick="selectOption(${i})">
                            ${opt}
                        </button>
                    `).join('')}
                </div>

                <div class="rationale-box" id="rationale-box">
                    <strong id="feedback-heading"></strong>
                    <span id="rationale-text">${phase.rationale}</span>
                    ${phase.nremtPrinciple ? `<div class="nremt-principle">${phase.nremtPrinciple}</div>` : ''}
                </div>

                <div class="card-footer">
                    <button class="nav-btn" id="next-btn" onclick="nextPhase()">
                        ${currentPhase === caseData.phases.length - 1 ? 'Finish Case' : 'Next Phase &rarr;'}
                    </button>
                </div>
            `;
        }

        function selectOption(selectedIndex) {
            if (answered) return;
            answered = true;

            const phase = cases[currentCase].phases[currentPhase];
            const isCorrect = selectedIndex === phase.correctIndex;
            const rationaleBox = document.getElementById('rationale-box');
            const feedbackHeading = document.getElementById('feedback-heading');
            const nextBtn = document.getElementById('next-btn');

            phase.options.forEach((_, i) => {
                const btn = document.getElementById(`opt-${i}`);
                btn.disabled = true;

                if (i === phase.correctIndex) {
                    btn.classList.add('show-correct');
                } else if (i === selectedIndex && !isCorrect) {
                    btn.classList.add('selected-incorrect');
                }
            });

            if (isCorrect) {
                rationaleBox.className = 'rationale-box correct';
                feedbackHeading.innerText = 'Correct!';
            } else {
                rationaleBox.className = 'rationale-box incorrect';
                feedbackHeading.innerText = 'Incorrect';
            }

            rationaleBox.style.display = 'block';
            nextBtn.style.display = 'inline-block';
        }

        function nextPhase() {
            currentPhase++;
            renderPhase();
        }

        // Initial Load
        renderPhase();
    </script>
</body>
</html>
"""

with open("nremt_burn_cases_interactive.html", "w", encoding="utf-8") as f:
    f.write(html_content)
