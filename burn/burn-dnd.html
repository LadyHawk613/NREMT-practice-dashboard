<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NREMT Burn Unit Challenge</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
    background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
    height: 100vh;
    margin: 0;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  .container {
    max-width: 1200px;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    color: #3d2b1f;
    text-shadow: 1px 1px 0 #fff8e1;
    margin: 5px 0;
    font-size: 1.6rem;
    text-align: center;
  }

  .progress-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }

  .dot {
    width: 14px;
    height: 14px;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    border: 2px solid #3d2b1f;
  }
  .dot.active { background: #3d2b1f; }

  .instructions-box {
    background: #fff8e1;
    border: 2px solid #f8b500;
    border-radius: 12px;
    padding: 8px 15px;
    width: 100%;
    margin-bottom: 10px;
    color: #4a3826;
    font-size: 14px;
    line-height: 1.3;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .instructions-box h2 {
    margin: 0 0 3px 0;
    color: #d35400;
    font-size: 1.1rem;
  }

  .game-area {
    flex: 1;
    display: flex;
    width: 100%;
    gap: 20px;
    justify-content: center;
    align-items: center;
    min-height: 0;
  }

  /* Ordering Layout */
  .ordering-layout {
    display: flex;
    gap: 40px;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    height: 100%;
  }

  /* Matching Layout */
  .matching-layout {
    display: flex;
    gap: 40px;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    height: 100%;
  }

  /* Sorting Layout */
  .sorting-layout {
    display: flex;
    gap: 40px;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    height: 100%;
  }

  .slots {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 0 0 450px;
  }

  .slot {
    width: 100%;
    height: 58px;
    background: rgba(255,255,255,0.5);
    border: 3px dashed #a1887f;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 5px 5px 5px 50px;
    transition: background 0.2s, border-color 0.2s;
  }

  .slot .slot-num {
    position: absolute;
    top: 50%;
    left: 15px;
    transform: translateY(-50%);
    font-size: 16px;
    color: #8d6e63;
    font-weight: bold;
  }

  .slot.over { background: rgba(255, 214, 92, 0.6); border-color: #f39c12; }
  .slot.correct { border-color: #2ecc71; background: rgba(46, 204, 113, 0.25); }
  .slot.incorrect { border-color: #e74c3c; background: rgba(231, 76, 60, 0.2); }

  /* Matching slots */
  .match-label {
    width: 150px;
    padding: 8px;
    text-align: right;
    font-weight: bold;
    font-size: 13px;
    color: #3d2b1f;
  }

  .match-slot {
    width: 200px;
    height: 58px;
    background: rgba(255,255,255,0.5);
    border: 3px dashed #a1887f;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, border-color 0.2s;
  }

  .match-slot.over { background: rgba(255, 214, 92, 0.6); border-color: #f39c12; }
  .match-slot.correct { border-color: #2ecc71; background: rgba(46, 204, 113, 0.25); }
  .match-slot.incorrect { border-color: #e74c3c; background: rgba(231, 76, 60, 0.2); }

  /* Sorting zones */
  .sort-zone {
    flex: 1;
    min-height: 200px;
    background: rgba(255,255,255,0.5);
    border: 3px dashed #a1887f;
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    transition: background 0.2s, border-color 0.2s;
  }

  .sort-zone.over { background: rgba(255, 214, 92, 0.6); border-color: #f39c12; }

  .sort-zone-label {
    font-weight: bold;
    font-size: 13px;
    color: #3d2b1f;
    text-align: center;
    padding: 5px;
    background: rgba(255,255,255,0.7);
    border-radius: 8px;
  }

  .right-panel {
    flex: 0 0 450px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    height: 100%;
    min-height: 0;
  }

  .bank {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    background: rgba(255,255,255,0.35);
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.5);
    overflow-y: auto;
  }

  .explanation {
    flex: 0 1 auto;
    width: 100%;
    padding: 15px;
    background: #fff;
    border-radius: 12px;
    border-left: 6px solid #3498db;
    display: none;
    font-size: 14px;
    color: #2c3e50;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    overflow-y: auto;
    max-height: 100%;
  }
  .explanation h3 { margin: 0 0 8px 0; color: #2980b9; font-size: 1.1rem; }

  /* Card Style */
  .card {
    width: 100%;
    min-height: 48px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    cursor: grab;
    padding: 8px 12px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    user-select: none;
    transition: transform 0.1s;
  }

  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.3; }
  .card:hover { transform: scale(1.02); }

  .card[data-color="1"] { background: linear-gradient(135deg, #ff7675, #d63031); }
  .card[data-color="2"] { background: linear-gradient(135deg, #74b9ff, #0984e3); }
  .card[data-color="3"] { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
  .card[data-color="4"] { background: linear-gradient(135deg, #55efc4, #00b894); }
  .card[data-color="5"] { background: linear-gradient(135deg, #fd79a8, #e84393); }

  .buttons {
    margin: 15px 0;
    display: flex;
    gap: 15px;
  }

  button {
    border: none;
    padding: 10px 25px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    transition: transform 0.1s;
  }

  button:hover { transform: translateY(-2px); }
  #checkBtn { background: #2ecc71; color: white; }
  #nextBtn { background: #3498db; color: white; display: none; }
  #resetBtn { background: #e17055; color: white; }

  #message {
    font-size: 18px;
    font-weight: bold;
    color: #3d2b1f;
    margin-bottom: 5px;
    height: 25px;
    text-align: center;
  }

</style>
</head>
<body>

<div class="container">
  <h1>🔥 NREMT Burn Unit Challenge</h1>

  <div class="progress-bar" id="progress">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="instructions-box" id="instructions">
    <!-- Content injected here -->
  </div>

  <div id="message"></div>

  <div class="game-area" id="gameArea">
    <!-- Layout injected here -->
  </div>

  <div class="buttons">
    <button id="checkBtn">✅ Check Answer</button>
    <button id="nextBtn">➡️ Next Activity</button>
    <button id="resetBtn">🔄 Reset</button>
  </div>
</div>

<script>
  const activities = [
    {
      type: "ordering",
      title: "Activity 1: Prioritizing Burn Care",
      scenario: "<strong>Scenario:</strong> 35-year-old rescued from house fire with facial burns, soot around mouth, singed nasal hairs, coughing.<br>Place the EMT actions in the <strong>correct order of priority</strong>.",
      correctOrder: [
        { text: "Remove the patient from the hazardous environment", color: "1" },
        { text: "Assess airway and breathing", color: "2" },
        { text: "Administer high-concentration oxygen", color: "3" },
        { text: "Apply dry sterile dressings to burned areas", color: "4" },
        { text: "Determine burn size using Rule of Nines", color: "5" }
      ],
      explanation: "<h3>NREMT Priority:</h3>Scene safety and removal from danger come first. Airway concerns are prioritized because inhalation injuries can rapidly progress. Oxygen is indicated due to suspected smoke inhalation. Burn estimation and detailed assessment occur after immediate life threats are addressed."
    },
    {
      type: "matching",
      title: "Activity 2: Burn Classifications",
      scenario: "<strong>Scenario:</strong> Match each patient finding with the correct burn classification.<br>Drag each finding to the correct classification box.",
      findings: [
        { text: "Red, painful skin without blistering", id: "f1" },
        { text: "Moist, blistered skin with severe pain", id: "f2" },
        { text: "White, leathery skin with decreased sensation", id: "f3" },
        { text: "Small entrance and exit wounds with internal injury risk", id: "f4" }
      ],
      classifications: [
        { text: "Superficial Burn", id: "c1", correct: "f1" },
        { text: "Partial-Thickness Burn", id: "c2", correct: "f2" },
        { text: "Full-Thickness Burn", id: "c3", correct: "f3" },
        { text: "Electrical Burn", id: "c4", correct: "f4" }
      ],
      explanation: "<h3>NREMT Priority:</h3>The NREMT emphasizes recognizing burn severity based on appearance, depth, and mechanism. Electrical burns require special consideration because visible injury may underestimate internal damage."
    },
    {
      type: "sorting",
      title: "Activity 3: Burn Center Transport",
      scenario: "<strong>Scenario:</strong> Sort patients based on whether they require Burn Center transport or routine ED evaluation.",
      patients: [
        { text: "45M: partial-thickness facial burns with airway symptoms", id: "p1", category: "burn-center", color: "1" },
        { text: "60F: superficial burn to one forearm from hot water", id: "p2", category: "routine-ed", color: "2" },
        { text: "25M: full-thickness burns covering both hands", id: "p3", category: "burn-center", color: "3" },
        { text: "40M: partial-thickness burns covering 5% of thigh", id: "p4", category: "routine-ed", color: "4" },
        { text: "70F: burns involving the genital region", id: "p5", category: "burn-center", color: "5" }
      ],
      explanation: "<h3>NREMT Priority:</h3>Special circumstances requiring Burn Center care include: face, hands, feet, genitalia, major joints, circumferential burns, and electrical/chemical mechanisms. Small superficial or partial-thickness burns to non-critical areas can be evaluated at a routine ED."
    }
  ];

  let currentIdx = 0;
  const gameArea = document.getElementById("gameArea");
  const instructions = document.getElementById("instructions");
  const message = document.getElementById("message");
  const nextBtn = document.getElementById("nextBtn");
  const checkBtn = document.getElementById("checkBtn");
  const progressDots = document.querySelectorAll(".dot");

  function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

  function createCard(text, color, id) {
    const card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    card.dataset.text = text;
    card.dataset.color = color;
    card.dataset.id = id;
    card.textContent = text;
    card.addEventListener("dragstart", () => card.classList.add("dragging"));
    card.addEventListener("dragend", () => card.classList.remove("dragging"));
    return card;
  }

  function loadActivity() {
    const act = activities[currentIdx];
    instructions.innerHTML = `<h2>${act.title}</h2><p>${act.scenario}</p>`;
    gameArea.innerHTML = "";
    message.textContent = "";
    nextBtn.style.display = "none";
    checkBtn.style.display = "inline-block";
    
    progressDots.forEach((dot, i) => dot.classList.toggle("active", i === currentIdx));

    if (act.type === "ordering") {
      loadOrderingActivity(act);
    } else if (act.type === "matching") {
      loadMatchingActivity(act);
    } else if (act.type === "sorting") {
      loadSortingActivity(act);
    }
  }

  function loadOrderingActivity(act) {
    const orderingDiv = document.createElement("div");
    orderingDiv.className = "ordering-layout";
    
    const slotsDiv = document.createElement("div");
    slotsDiv.className = "slots";
    act.correctOrder.forEach((_, i) => {
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.dataset.index = i;
      slot.innerHTML = `<span class="slot-num">${i + 1}</span>`;
      slotsDiv.appendChild(slot);
    });
    
    const rightPanel = document.createElement("div");
    rightPanel.className = "right-panel";
    
    const bankDiv = document.createElement("div");
    bankDiv.className = "bank";
    bankDiv.id = "bank";
    shuffle(act.correctOrder).forEach(c => bankDiv.appendChild(createCard(c.text, c.color, c.text)));
    
    const explanationDiv = document.createElement("div");
    explanationDiv.className = "explanation";
    explanationDiv.id = "explanation";
    
    rightPanel.appendChild(bankDiv);
    rightPanel.appendChild(explanationDiv);
    
    orderingDiv.appendChild(slotsDiv);
    orderingDiv.appendChild(rightPanel);
    gameArea.appendChild(orderingDiv);
    
    setupDragDropOrdering();
  }

  function loadMatchingActivity(act) {
    const matchingDiv = document.createElement("div");
    matchingDiv.className = "matching-layout";
    
    const leftPanel = document.createElement("div");
    leftPanel.style.flex = "1";
    leftPanel.style.display = "flex";
    leftPanel.style.flexDirection = "column";
    leftPanel.style.gap = "10px";
    
    act.findings.forEach(finding => {
      const row = document.createElement("div");
      row.style.display = "flex";
      row.style.gap = "10px";
      row.style.alignItems = "center";
      const label = document.createElement("div");
      label.className = "match-label";
      label.textContent = finding.text;
      const slot = document.createElement("div");
      slot.className = "match-slot";
      slot.dataset.id = finding.id;
      row.appendChild(label);
      row.appendChild(slot);
      leftPanel.appendChild(row);
    });
    
    const rightPanel = document.createElement("div");
    rightPanel.className = "right-panel";
    
    const bankDiv = document.createElement("div");
    bankDiv.className = "bank";
    bankDiv.id = "bank";
    shuffle(act.classifications).forEach((c, i) => bankDiv.appendChild(createCard(c.text, (i % 5) + 1, c.id)));
    
    const explanationDiv = document.createElement("div");
    explanationDiv.className = "explanation";
    explanationDiv.id = "explanation";
    
    rightPanel.appendChild(bankDiv);
    rightPanel.appendChild(explanationDiv);
    
    matchingDiv.appendChild(leftPanel);
    matchingDiv.appendChild(rightPanel);
    gameArea.appendChild(matchingDiv);
    
    setupDragDropMatching(act);
  }

  function loadSortingActivity(act) {
    const sortingDiv = document.createElement("div");
    sortingDiv.className = "sorting-layout";
    
    const leftZone = document.createElement("div");
    leftZone.className = "sort-zone";
    leftZone.id = "burn-center";
    leftZone.dataset.category = "burn-center";
    const leftLabel = document.createElement("div");
    leftLabel.className = "sort-zone-label";
    leftLabel.textContent = "Transport to Burn Center";
    leftZone.appendChild(leftLabel);
    
    const rightZone = document.createElement("div");
    rightZone.className = "sort-zone";
    rightZone.id = "routine-ed";
    rightZone.dataset.category = "routine-ed";
    const rightLabel = document.createElement("div");
    rightLabel.className = "sort-zone-label";
    rightLabel.textContent = "Routine ED Evaluation";
    rightZone.appendChild(rightLabel);
    
    const bankDiv = document.createElement("div");
    bankDiv.className = "bank";
    bankDiv.id = "bank";
    shuffle(act.patients).forEach(p => bankDiv.appendChild(createCard(p.text, p.color, p.id)));
    
    const rightPanel = document.createElement("div");
    rightPanel.className = "right-panel";
    
    const explanationDiv = document.createElement("div");
    explanationDiv.className = "explanation";
    explanationDiv.id = "explanation";
    
    rightPanel.appendChild(bankDiv);
    rightPanel.appendChild(explanationDiv);
    
    sortingDiv.appendChild(leftZone);
    sortingDiv.appendChild(rightZone);
    sortingDiv.appendChild(rightPanel);
    gameArea.appendChild(sortingDiv);
    
    setupDragDropSorting(act);
  }

  function setupDragDropOrdering() {
    const targets = document.querySelectorAll(".slot, #bank");
    targets.forEach(target => {
      target.addEventListener("dragover", e => {
        e.preventDefault();
        if (target.classList.contains("slot")) target.classList.add("over");
      });
      target.addEventListener("dragleave", () => target.classList.remove("over"));
      target.addEventListener("drop", e => {
        e.preventDefault();
        target.classList.remove("over");
        const card = document.querySelector(".dragging");
        if (!card) return;
        if (target.classList.contains("slot")) {
          const existing = target.querySelector(".card");
          if (existing && existing !== card) document.getElementById("bank").appendChild(existing);
          target.appendChild(card);
        } else {
          target.appendChild(card);
        }
        message.textContent = "";
        document.querySelectorAll(".slot").forEach(s => s.classList.remove("correct", "incorrect"));
      });
    });
  }

  function setupDragDropMatching(act) {
    const targets = document.querySelectorAll(".match-slot, #bank");
    targets.forEach(target => {
      target.addEventListener("dragover", e => {
        e.preventDefault();
        if (target.classList.contains("match-slot")) target.classList.add("over");
      });
      target.addEventListener("dragleave", () => target.classList.remove("over"));
      target.addEventListener("drop", e => {
        e.preventDefault();
        target.classList.remove("over");
        const card = document.querySelector(".dragging");
        if (!card) return;
        if (target.classList.contains("match-slot")) {
          const existing = target.querySelector(".card");
          if (existing && existing !== card) document.getElementById("bank").appendChild(existing);
          target.appendChild(card);
        } else {
          target.appendChild(card);
        }
        message.textContent = "";
        document.querySelectorAll(".match-slot").forEach(s => s.classList.remove("correct", "incorrect"));
      });
    });
  }

  function setupDragDropSorting(act) {
    const targets = document.querySelectorAll(".sort-zone, #bank");
    targets.forEach(target => {
      target.addEventListener("dragover", e => {
        e.preventDefault();
        if (target.classList.contains("sort-zone")) target.classList.add("over");
      });
      target.addEventListener("dragleave", () => target.classList.remove("over"));
      target.addEventListener("drop", e => {
        e.preventDefault();
        target.classList.remove("over");
        const card = document.querySelector(".dragging");
        if (!card) return;
        target.appendChild(card);
        message.textContent = "";
      });
    });
  }

  checkBtn.addEventListener("click", () => {
    const act = activities[currentIdx];
    let isCorrect = true;

    if (act.type === "ordering") {
      checkOrdering(act);
    } else if (act.type === "matching") {
      checkMatching(act);
    } else if (act.type === "sorting") {
      checkSorting(act);
    }
  });

  function checkOrdering(act) {
    let isCorrect = true;
    let filledCount = 0;
    const slots = document.querySelectorAll(".slot");
    slots.forEach((slot, i) => {
      const card = slot.querySelector(".card");
      slot.classList.remove("correct", "incorrect");
      if (!card) { isCorrect = false; return; }
      filledCount++;
      if (card.dataset.text === act.correctOrder[i].text) {
        slot.classList.add("correct");
      } else {
        slot.classList.add("incorrect");
        isCorrect = false;
      }
    });
    if (filledCount < act.correctOrder.length) {
      message.textContent = "Fill all the boxes before checking! 📦";
      message.style.color = "#d35400";
      return;
    }
    if (isCorrect) {
      showCorrect(act);
    } else {
      message.textContent = "Not quite. Green boxes are correct, red boxes need fixing.";
      message.style.color = "#c0392b";
    }
  }

  function checkMatching(act) {
    let isCorrect = true;
    let filledCount = 0;
    const slots = document.querySelectorAll(".match-slot");
    slots.forEach(slot => {
      const card = slot.querySelector(".card");
      slot.classList.remove("correct", "incorrect");
      if (!card) { isCorrect = false; return; }
      filledCount++;
      const findingId = slot.dataset.id;
      const correctClassId = act.classifications.find(c => c.correct === findingId).id;
      if (card.dataset.id === correctClassId) {
        slot.classList.add("correct");
      } else {
        slot.classList.add("incorrect");
        isCorrect = false;
      }
    });
    if (filledCount < act.classifications.length) {
      message.textContent = "Fill all the boxes before checking! 📦";
      message.style.color = "#d35400";
      return;
    }
    if (isCorrect) {
      showCorrect(act);
    } else {
      message.textContent = "Not quite. Green boxes are correct, red boxes need fixing.";
      message.style.color = "#c0392b";
    }
  }

  function checkSorting(act) {
    let isCorrect = true;
    const zones = document.querySelectorAll(".sort-zone");
    zones.forEach(zone => {
      const cards = zone.querySelectorAll(".card");
      cards.forEach(card => {
        const patient = act.patients.find(p => p.id === card.dataset.id);
        if (patient.category !== zone.dataset.category) {
          isCorrect = false;
        }
      });
    });
    const bankCards = document.getElementById("bank").querySelectorAll(".card");
    if (bankCards.length > 0) {
      message.textContent = "Sort all patients before checking! 📦";
      message.style.color = "#d35400";
      return;
    }
    if (isCorrect) {
      showCorrect(act);
    } else {
      message.textContent = "Not quite. Check your sorting and try again.";
      message.style.color = "#c0392b";
    }
  }

  function showCorrect(act) {
    message.textContent = "🎉 Correct!";
    message.style.color = "#27ae60";
    const explanationBox = document.getElementById("explanation");
    explanationBox.innerHTML = act.explanation;
    explanationBox.style.display = "block";
    document.getElementById("bank").style.display = "none";
    checkBtn.style.display = "none";
    nextBtn.style.display = "inline-block";
    if (currentIdx === activities.length - 1) nextBtn.textContent = "🏁 Finish Challenge";
  }

  nextBtn.addEventListener("click", () => {
    if (currentIdx < activities.length - 1) {
      currentIdx++;
      loadActivity();
    } else {
      instructions.innerHTML = "<h2>Burn Unit Challenge Complete!</h2>";
      gameArea.innerHTML = "<div style='font-size: 80px;'>🔥</div>";
      checkBtn.style.display = "none";
      nextBtn.style.display = "none";
      message.textContent = "Great job, EMT!";
    }
  });

  document.getElementById("resetBtn").addEventListener("click", loadActivity);
  loadActivity();
</script>

</body>
</html>
