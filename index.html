<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NREMT Practice Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

  body {
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #e0f7fa, #80deea);
  min-height: 100vh;
  margin: 0;
  padding: 40px 20px;
  text-align: center;
}

h1 {
  color: #083344;
  margin-bottom: 10px;
}

.subtitle {
  color: #164e63;
  margin-bottom: 30px;
}

.dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  max-width: 900px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 10px 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #0284c7;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #0369a1;
  transform: translateY(-2px);
}

.description {
  margin-top: 12px;
  color: #475569;
  font-size: 14px;
}
</style>

</head>

<body>

<h1>🚑 NREMT Practice Dashboard</h1>

<div class="subtitle">
Select a practice category
</div>

<div class="dashboard">

  <!-- Cardiac -->
  <div class="card">
    <button onclick="location.href='cardiac/cardiac-hub.html'">
      🫀 Cardiology
    </button>
  </div>

  <!-- Endocrine -->
  <div class="card">
    <button onclick="location.href='metabolic/metabolic-hub.html'">
      🩺 Endocrine & Metabolic
    </button>
  </div>

  <!-- Neurologic -->
  <div class="card">
    <button onclick="location.href='respiratory/respiratory-hub.html'">
      🫁 Respiratory
    </button>
  </div>

  <!-- Pharmacology -->
  <div class="card">
    <button onclick="location.href='pharmacology/pharmacology-hub.html'">
      💊 Pharmacology
    </button>
  </div>
  
  <!-- Environmental --> 
  <div class="card">
    <button onclick="location.href='environmental/environmental-hub.html'">
      🏞️ Environmental
    </button>
  </div>

  <!-- Geriatrics -->
  <div class="card">
    <button onclick="location.href='geriatric/geriatric-hub.html'">
      👴 Geriatric
    </button>
  </div>

  <!-- OBGYN -->
  <div class="card">
    <button onclick="location.href='obgyn/obgyn-hub.html'">
      🤰 OB-GYN
    </button>
  </div>

  <!-- Neurological -->
  <div class="card">
    <button onclick="location.href='neurological/neurological-hub.html'">
      🧠 Neurological
    </button>
  </div>

  <!-- Pediatric -->
  <div class="card">
    <button onclick="location.href='pediatrics/pediatrics-hub.html'">
      🧸 Pediatrics
    </button>
  </div>

  <!-- Operations -->
  <div class="card">
    <button onclick="location.href='operations/operations-hub.html'">
      🚑 Operations
    </button>
  </div>

  <!-- Trauma -->
  <div class="card">
    <button onclick="location.href='trauma/trauma-hub.html'">
      🩸 Trauma
    </button>
  </div>

  <!-- Burns -->
  <div class="card">
    <button onclick="location.href='burn/burn-hub.html'">
      🔥 Burns
    </button>
  </div>
  
</div>   
</body>
</html>
