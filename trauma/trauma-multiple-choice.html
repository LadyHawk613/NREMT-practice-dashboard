<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NREMT Trauma Emergencies Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-indigo-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Trauma Emergencies Practice</h1>
            <p class="text-indigo-100 text-sm mt-1">NREMT Cognitive Exam (Level 3–4 Clinical Reasoning)</p>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2">
            <div id="progress" class="bg-indigo-500 h-2 transition-all duration-500" style="width: 0%"></div>
        </div>

        <div id="quiz-container" class="p-6">
            <!-- Question Section -->
            <div id="question-box" class="fade-in">
                <div class="flex justify-between items-center mb-4">
                    <span id="question-number" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Question 1 of 20</span>
                    <span id="score-display" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">Score: 0</span>
                </div>
                
                <h2 id="question-text" class="text-lg font-semibold text-slate-800 mb-6 leading-snug">
                    Loading question...
                </h2>

                <div id="options" class="space-y-3">
                    <!-- Options injected here -->
                </div>

                <!-- Feedback Section (Hidden by default) -->
                <div id="feedback" class="mt-6 p-4 rounded-lg hidden border">
                    <div class="flex items-center mb-2">
                        <span id="feedback-icon" class="mr-2 font-bold"></span>
                        <span id="feedback-status" class="font-bold text-sm uppercase"></span>
                    </div>
                    <p id="feedback-text" class="text-sm text-slate-600 italic"></p>
                </div>

                <!-- Navigation -->
                <button id="next-btn" class="mt-8 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition-colors hidden shadow-md">
                    Next Question
                </button>
            </div>

            <!-- Results Section (Hidden by default) -->
            <div id="results-box" class="hidden text-center py-10 fade-in">
                <div class="text-6xl mb-4">🚨</div>
                <h2 class="text-3xl font-bold text-slate-800 mb-2">Quiz Complete!</h2>
                <p class="text-slate-500 mb-6">You've finished the NREMT Trauma Emergencies assessment.</p>
                
                <div class="inline-block p-8 bg-indigo-50 rounded-2xl mb-8 border border-indigo-100">
                    <div id="final-score" class="text-5xl font-bold text-indigo-700 mb-2">0/20</div>
                    <div id="percentage" class="text-xl font-semibold text-indigo-500">0%</div>
                </div>

                <div id="result-message" class="mb-8 px-4 text-slate-700 italic"></div>
                
                <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-lg transition-colors shadow-md">
                    Try Again
                </button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "A 32-year-old male was involved in a high-speed head-on collision. He is awake but confused and repeatedly asks what happened. His airway is patent, respirations are 24/min, pulse is 118/min, BP is 104/68 mmHg, and he has bruising across his chest from the seat belt. Which injury should concern you most?",
                options: [
                    "Concussion",
                    "Rib fracture",
                    "Blunt aortic injury",
                    "Clavicle fracture"
                ],
                answer: 2,
                explanation: "Significant deceleration with a seat belt sign raises concern for blunt aortic injury, which is life-threatening."
            },
            {
                q: "A construction worker fell 20 feet and landed on his feet. He complains of severe back pain but denies neck pain. What should you suspect?",
                options: [
                    "Isolated ankle fractures",
                    "Spinal injury despite lack of neck pain",
                    "Hip dislocation only",
                    "Muscle strain"
                ],
                answer: 1,
                explanation: "Axial loading can produce spinal injuries even without neck pain."
            },
            {
                q: "During your primary assessment, you find an unconscious trauma patient with snoring respirations. Your FIRST intervention is to:",
                options: [
                    "Apply oxygen",
                    "Insert an OPA",
                    "Open the airway while maintaining spinal motion restriction",
                    "Obtain a blood pressure"
                ],
                answer: 2,
                explanation: "Airway management always takes priority."
            },
            {
                q: "A conscious patient has a penetrating wound to the right chest. He becomes increasingly short of breath with absent breath sounds on the injured side. You should suspect:",
                options: [
                    "Hemothorax",
                    "Pulmonary embolism",
                    "Tension pneumothorax",
                    "Cardiac tamponade"
                ],
                answer: 2,
                explanation: "Progressive respiratory distress with unilateral absent breath sounds suggests tension pneumothorax."
            },
            {
                q: "A trauma patient has jugular vein distention, muffled heart tones, and hypotension. These findings suggest:",
                options: [
                    "Neurogenic shock",
                    "Cardiac tamponade",
                    "Massive hemothorax",
                    "Pulmonary contusion"
                ],
                answer: 1,
                explanation: "Beck's triad indicates cardiac tamponade."
            },
            {
                q: "A patient has an open femur fracture with severe bleeding. Direct pressure has failed. The NEXT intervention is:",
                options: [
                    "Splint the fracture",
                    "Apply a tourniquet",
                    "Elevate the leg",
                    "Apply an ice pack"
                ],
                answer: 1,
                explanation: "Tourniquets are indicated for severe extremity hemorrhage uncontrolled by direct pressure."
            },
            {
                q: "A motorcycle rider was thrown 40 feet. He is alert but pale and diaphoretic. BP is 88/56 mmHg, pulse is 132/min, respirations are 26/min. Which type of shock is MOST likely?",
                options: [
                    "Septic",
                    "Neurogenic",
                    "Hypovolemic",
                    "Cardiogenic"
                ],
                answer: 2,
                explanation: "Trauma with hypotension and tachycardia indicates hemorrhagic hypovolemic shock."
            },
            {
                q: "Which trauma patient should be transported immediately to a trauma center?",
                options: [
                    "Stable isolated wrist fracture",
                    "Minor scalp laceration",
                    "Hypotensive patient after blunt abdominal trauma",
                    "Isolated ankle sprain"
                ],
                answer: 2,
                explanation: "Hypotension after trauma suggests internal hemorrhage requiring definitive care."
            },
            {
                q: "Which finding MOST strongly suggests a basilar skull fracture?",
                options: [
                    "Unequal pupils",
                    "Battle sign",
                    "Facial swelling",
                    "Nosebleed"
                ],
                answer: 1,
                explanation: "Battle sign is a classic sign of basilar skull fracture."
            },
            {
                q: "A trauma patient has paradoxical movement of a section of the chest wall. This finding indicates:",
                options: [
                    "Pulmonary edema",
                    "Flail chest",
                    "Pneumonia",
                    "Hemothorax"
                ],
                answer: 1,
                explanation: "Flail chest occurs when multiple adjacent ribs are fractured in multiple places."
            },
            {
                q: "A patient with blunt abdominal trauma complains of left shoulder pain. This is MOST consistent with injury to the:",
                options: [
                    "Liver",
                    "Spleen",
                    "Kidney",
                    "Bladder"
                ],
                answer: 1,
                explanation: "Kehr's sign indicates splenic injury."
            },
            {
                q: "During your secondary assessment, you note unequal pupils in a patient with head trauma whose mental status is deteriorating. This suggests:",
                options: [
                    "Increasing intracranial pressure",
                    "Alcohol intoxication",
                    "Stroke",
                    "Hyperglycemia"
                ],
                answer: 0,
                explanation: "Unequal pupils with declining mental status indicate possible brain herniation."
            },
            {
                q: "Which patient should receive spinal motion restriction?",
                options: [
                    "Alert patient with isolated finger injury",
                    "Alert patient with neck pain after MVC",
                    "Patient with isolated ankle sprain",
                    "Patient with isolated forearm laceration"
                ],
                answer: 1,
                explanation: "Neck pain after significant mechanism warrants spinal precautions."
            },
            {
                q: "A trauma patient has an impaled object in the abdomen. You should:",
                options: [
                    "Remove it immediately",
                    "Shorten it if necessary and stabilize it",
                    "Push it farther in",
                    "Cover only with gauze"
                ],
                answer: 1,
                explanation: "Stabilize the object and transport rapidly."
            },
            {
                q: "Which patient is MOST likely experiencing neurogenic shock?",
                options: [
                    "Tachycardic trauma patient with cool skin",
                    "Patient with spinal injury who is hypotensive and bradycardic",
                    "Trauma patient with severe bleeding",
                    "Patient with tension pneumothorax"
                ],
                answer: 1,
                explanation: "Neurogenic shock causes hypotension with bradycardia."
            },
            {
                q: "A trauma patient suddenly becomes restless, tachycardic, and hypotensive. What is the BEST interpretation?",
                options: [
                    "Pain medication reaction",
                    "Compensated shock progressing toward decompensation",
                    "Anxiety only",
                    "Hyperventilation syndrome"
                ],
                answer: 1,
                explanation: "Restlessness is often one of the earliest signs of worsening shock."
            },
            {
                q: "A patient has an open chest wound that is bubbling air. Appropriate management includes:",
                options: [
                    "Leave the wound uncovered",
                    "Apply an occlusive dressing secured according to local protocol",
                    "Pack the wound tightly with gauze",
                    "Apply a tourniquet"
                ],
                answer: 1,
                explanation: "An occlusive dressing helps reduce air entry into the pleural space."
            },
            {
                q: "During a rapid trauma assessment, which finding requires the MOST immediate intervention?",
                options: [
                    "Deformed forearm",
                    "Minor facial laceration",
                    "Massive external hemorrhage from the thigh",
                    "Bruising to the knee"
                ],
                answer: 2,
                explanation: "Life-threatening bleeding is addressed immediately."
            },
            {
                q: "Which trauma patient is MOST likely suffering from internal bleeding?",
                options: [
                    "Isolated shoulder dislocation",
                    "Stable wrist fracture",
                    "Pelvic instability with hypotension",
                    "Finger laceration"
                ],
                answer: 2,
                explanation: "Pelvic fractures can cause massive internal hemorrhage."
            },
            {
                q: "You are transporting a trauma patient whose blood pressure is decreasing despite hemorrhage control. Your priority is to:",
                options: [
                    "Delay transport for a complete secondary exam",
                    "Continue rapid transport while reassessing ABCs",
                    "Splint every fracture before leaving the scene",
                    "Obtain a detailed medical history"
                ],
                answer: 1,
                explanation: "Trauma patients with signs of shock require rapid transport and continuous reassessment of airway, breathing, circulation, and bleeding control."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options');
        const questionNumber = document.getElementById('question-number');
        const scoreDisplay = document.getElementById('score-display');
        const feedback = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackStatus = document.getElementById('feedback-status');
        const feedbackIcon = document.getElementById('feedback-icon');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress');

        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestion];
            
            feedback.classList.add('hidden');
            nextBtn.classList.add('hidden');
            optionsContainer.innerHTML = '';
            
            questionNumber.innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
            questionText.innerText = q.q;
            progressBar.style.width = `${((currentQuestion) / questions.length) * 100}%`;

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-lg border-2 border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 transition-all font-medium text-slate-700 flex items-start";
                btn.innerHTML = `<span class="bg-slate-100 text-slate-500 w-6 h-6 rounded-full inline-flex items-center justify-center mr-3 flex-shrink-0 text-xs">${String.fromCharCode(65 + index)}</span> <span>${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, clickedBtn) {
            if (answered) return;
            answered = true;

            const correct = questions[currentQuestion].answer;
            const allBtns = optionsContainer.querySelectorAll('button');

            if (selectedIndex === correct) {
                score++;
                scoreDisplay.innerText = `Score: ${score}`;
                clickedBtn.classList.replace('border-slate-200', 'border-green-500');
                clickedBtn.classList.add('bg-green-50');
                showFeedback(true);
            } else {
                clickedBtn.classList.replace('border-slate-200', 'border-red-500');
                clickedBtn.classList.add('bg-red-50');
                allBtns[correct].classList.replace('border-slate-200', 'border-green-500');
                allBtns[correct].classList.add('bg-green-50');
                showFeedback(false);
            }

            allBtns.forEach(btn => btn.disabled = true);
            nextBtn.classList.remove('hidden');
            
            if (currentQuestion === questions.length - 1) {
                nextBtn.innerText = "See Results";
            }
        }

        function showFeedback(isCorrect) {
            feedback.classList.remove('hidden');
            if (isCorrect) {
                feedback.classList.add('bg-green-50', 'border-green-100');
                feedback.classList.remove('bg-red-50', 'border-red-100');
                feedbackStatus.innerText = "Correct";
                feedbackStatus.className = "font-bold text-sm uppercase text-green-700";
                feedbackIcon.innerText = "✓";
                feedbackIcon.className = "mr-2 font-bold text-green-700";
            } else {
                feedback.classList.add('bg-red-50', 'border-red-100');
                feedback.classList.remove('bg-green-50', 'border-green-100');
                feedbackStatus.innerText = "Incorrect";
                feedbackStatus.className = "font-bold text-sm uppercase text-red-700";
                feedbackIcon.innerText = "✗";
                feedbackIcon.className = "mr-2 font-bold text-red-700";
            }
            feedbackText.innerText = questions[currentQuestion].explanation;
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            document.getElementById('question-box').classList.add('hidden');
            const resultsBox = document.getElementById('results-box');
            resultsBox.classList.remove('hidden');
            progressBar.style.width = '100%';

            const finalScore = document.getElementById('final-score');
            const percentage = document.getElementById('percentage');
            const message = document.getElementById('result-message');

            const percent = Math.round((score / questions.length) * 100);
            finalScore.innerText = `${score}/${questions.length}`;
            percentage.innerText = `${percent}%`;

            if (percent >= 85) {
                message.innerText = "Outstanding job! You have demonstrated strong clinical decision-making skills in NREMT Trauma Emergencies.";
            } else if (percent >= 70) {
                message.innerText = "Good effort! Review the questions you missed, especially regarding shock recognition, chest trauma mechanics, and trauma triage criteria.";
            } else {
                message.innerText = "Keep practicing! Revisit core trauma concepts, paying close attention to primary assessments, hemorrhage control, and life-threatening injury patterns.";
            }
        }

        loadQuestion();
    </script>
</body>
</html>
