<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NREMT EMS Operations Challenge</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
    background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
    height: 100vh;
    margin: 0;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  .container {
    max-width: 1200px;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    color: #3d2b1f;
    text-shadow: 1px 1px 0 #fff8e1;
    margin: 5px 0;
    font-size: 1.6rem;
    text-align: center;
  }

  .progress-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }

  .dot {
    width: 14px;
    height: 14px;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    border: 2px solid #3d2b1f;
  }
  .dot.active { background: #3d2b1f; }

  .instructions-box {
    background: #fff8e1;
    border: 2px solid #f8b500;
    border-radius: 12px;
    padding: 8px 15px;
    width: 100%;
    margin-bottom: 10px;
    color: #4a3826;
    font-size: 14px;
    line-height: 1.3;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .instructions-box h2 {
    margin: 0 0 3px 0;
    color: #d35400;
    font-size: 1.1rem;
  }

  .game-area {
    flex: 1;
    display: flex;
    width: 100%;
    gap: 20px;
    justify-content: center;
    align-items: stretch;
    min-height: 0;
  }

  /* Layouts */
  .layout-container {
    display: flex;
    width: 100%;
    gap: 20px;
    align-items: stretch;
    height: 100%;
  }

  /* Left/Right Columns */
  .side-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  .center-panel {
    flex: 0 0 350px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  .column-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: rgba(255,255,255,0.25);
    border-radius: 16px;
    padding: 10px;
    border: 2px solid rgba(255,255,255,0.4);
    min-height: 0;
  }

  .column-title {
    text-align: center;
    font-weight: bold;
    color: #3d2b1f;
    margin-bottom: 8px;
    font-size: 0.95rem;
    padding: 6px;
    background: rgba(255,255,255,0.5);
    border-radius: 10px;
  }

  .drop-container {
    flex: 1;
    border: 3px dashed #a1887f;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
    transition: background 0.2s;
    overflow-y: auto;
  }

  .drop-container.over {
    background: rgba(255, 214, 92, 0.4);
    border-color: #f39c12;
  }

  .bank {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    background: rgba(255,255,255,0.35);
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.5);
    overflow-y: auto;
  }

  .explanation {
    flex: 1;
    width: 100%;
    padding: 15px;
    background: #fff;
    border-radius: 12px;
    border-left: 6px solid #3498db;
    display: none;
    font-size: 14px;
    color: #2c3e50;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    overflow-y: auto;
  }
  .explanation h3 { margin: 0 0 8px 0; color: #2980b9; font-size: 1.1rem; }

  /* Card Style */
  .card {
    width: 100%;
    min-height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    cursor: grab;
    padding: 8px 12px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    user-select: none;
    transition: transform 0.1s;
  }

  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.3; }
  .card:hover { transform: scale(1.02); }

  .card[data-color="1"] { background: linear-gradient(135deg, #ff7675, #d63031); }
  .card[data-color="2"] { background: linear-gradient(135deg, #74b9ff, #0984e3); }
  .card[data-color="3"] { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
  .card[data-color="4"] { background: linear-gradient(135deg, #55efc4, #00b894); }
  .card[data-color="5"] { background: linear-gradient(135deg, #fd79a8, #e84393); }
  .card[data-color="6"] { background: linear-gradient(135deg, #fab1a0, #e17055); }
  .card[data-color="7"] { background: linear-gradient(135deg, #81ecec, #00cec9); }
  .card[data-color="8"] { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); }

  /* Specific Activity Layouts */
  .ordering-slots {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 0 0 450px;
  }

  .slot {
    width: 100%;
    height: 58px;
    background: rgba(255,255,255,0.5);
    border: 3px dashed #a1887f;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 5px 5px 5px 50px;
    transition: background 0.2s, border-color 0.2s;
  }

  .slot .slot-num {
    position: absolute;
    top: 50%;
    left: 15px;
    transform: translateY(-50%);
    font-size: 16px;
    color: #8d6e63;
    font-weight: bold;
  }

  .slot.over { background: rgba(255, 214, 92, 0.6); border-color: #f39c12; }
  .slot.correct, .matching-drop-zone.correct { border-color: #2ecc71; background: rgba(46, 204, 113, 0.25); }
  .slot.incorrect, .matching-drop-zone.incorrect { border-color: #e74c3c; background: rgba(231, 76, 60, 0.2); }

  .matching-labels {
    flex: 0 0 250px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .matching-label {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.6);
    border-radius: 10px;
    font-size: 13px;
    font-weight: bold;
    color: #3d2b1f;
    padding: 5px 10px;
    text-align: center;
    border: 1px solid rgba(0,0,0,0.1);
  }

  .matching-drops {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .matching-drop-zone {
    height: 60px;
    border: 2px dashed #a1887f;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    background: rgba(255,255,255,0.2);
  }

  .matching-drop-zone.over {
    background: rgba(255, 214, 92, 0.4);
    border-color: #f39c12;
  }

  .buttons {
    margin: 15px 0;
    display: flex;
    gap: 15px;
  }

  button {
    border: none;
    padding: 10px 25px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    transition: transform 0.1s;
  }

  button:hover { transform: translateY(-2px); }
  #checkBtn { background: #2ecc71; color: white; }
  #nextBtn { background: #3498db; color: white; display: none; }
  #resetBtn { background: #e17055; color: white; }

  #message {
    font-size: 18px;
    font-weight: bold;
    color: #3d2b1f;
    margin-bottom: 5px;
    height: 25px;
    text-align: center;
  }

</style>
</head>
<body>

<div class="container">
  <h1>🚑 EMS Operations Challenge</h1>

  <div class="progress-bar" id="progress">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="instructions-box" id="instructions">
    <!-- Content injected here -->
  </div>

  <div id="message"></div>

  <div class="game-area" id="gameArea">
    <!-- Layout injected here -->
  </div>

  <div class="buttons">
    <button id="checkBtn">✅ Check Answer</button>
    <button id="nextBtn">➡️ Next Activity</button>
    <button id="resetBtn">🔄 Reset</button>
  </div>
</div>

<script>
  const activities = [
    {
      type: "ordering",
      title: "Activity 1: Scene Size-Up and Safety Priorities",
      scenario: "<strong>Scenario:</strong> Multi-vehicle collision, broken glass, moving traffic, bystanders. Arrange the EMT actions in the <strong>correct order</strong>.",
      correctOrder: [
        { text: "Put on appropriate PPE", color: "1" },
        { text: "Ensure the scene is safe before entering", color: "2" },
        { text: "Determine the number of patients and mechanism of injury", color: "3" },
        { text: "Request additional resources if needed", color: "4" },
        { text: "Begin patient care", color: "5" }
      ],
      explanation: "<h3>NREMT Rationale:</h3>1. Personal safety<br>2. Scene safety<br>3. Scene size-up<br>4. Resource management<br>5. Patient assessment/treatment.<br>An EMT who enters an unsafe scene becomes another patient."
    },
    {
      type: "sorting",
      title: "Activity 2: EMS Documentation Errors",
      scenario: "<strong>Scenario:</strong> Reviewing a patient care report (PCR). Sort each action into the correct category.",
      categories: [
        { name: "Acceptable Documentation Practice", id: "acceptable", correctItems: ["Documenting the patient's vital signs at regular intervals", "Recording medications, doses, and times administered", "Correcting an error according to agency policy", "Including patient refusal details and risks explained"] },
        { name: "Documentation Error", id: "error", correctItems: ["Changing a PCR entry by deleting information that was incorrect", "Leaving out treatment because \"it was routine\"", "Documenting only the patient's diagnosis instead of assessment findings", "Adding information later without following correction procedures"] }
      ],
      allCards: [
        { text: "Documenting the patient's vital signs at regular intervals", color: "1" },
        { text: "Changing a PCR entry by deleting information that was incorrect", color: "2" },
        { text: "Recording medications, doses, and times administered", color: "3" },
        { text: "Leaving out treatment because \"it was routine\"", color: "4" },
        { text: "Correcting an error according to agency policy", color: "5" },
        { text: "Documenting only the patient's diagnosis instead of assessment findings", color: "6" },
        { text: "Including patient refusal details and risks explained", color: "7" },
        { text: "Adding information later without following correction procedures", color: "8" }
      ],
      explanation: "<h3>NREMT Rationale:</h3>The PCR is a legal document. Good documentation is accurate, objective, includes treatments performed, patient responses, and avoids falsification."
    },
    {
      type: "matching",
      title: "Activity 3: Incident Command System (ICS) Roles",
      scenario: "<strong>Scenario:</strong> Large-scale incident. Match each EMS role with its correct responsibility.",
      pairs: [
        { condition: "Incident Commander", finding: "Establishes overall objectives and manages the incident", color: "1" },
        { condition: "Triage Officer", finding: "Determines patient priority categories", color: "2" },
        { condition: "Treatment Officer", finding: "Determines where patients receive medical treatment", color: "3" },
        { condition: "Transportation Officer", finding: "Coordinates movement of patients to hospitals", color: "4" },
        { condition: "Staging Officer", finding: "Controls movement and assignment of incoming resources", color: "5" }
      ],
      explanation: "<h3>NREMT Rationale:</h3>ICS creates organization. EMTs work within assigned roles. The Incident Commander coordinates overall operations. Individual EMTs should not self-deploy or freelance."
    }
  ];

  let currentIdx = 0;
  const gameArea = document.getElementById("gameArea");
  const instructions = document.getElementById("instructions");
  const message = document.getElementById("message");
  const nextBtn = document.getElementById("nextBtn");
  const checkBtn = document.getElementById("checkBtn");
  const progressDots = document.querySelectorAll(".dot");

  function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

  function createCard(text, color) {
    const card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    card.dataset.text = text;
    card.dataset.color = color;
    card.textContent = text;
    card.addEventListener("dragstart", () => card.classList.add("dragging"));
    card.addEventListener("dragend", () => card.classList.remove("dragging"));
    return card;
  }

  function loadActivity() {
    const act = activities[currentIdx];
    instructions.innerHTML = `<h2>${act.title}</h2><p>${act.scenario}</p>`;
    gameArea.innerHTML = "";
    message.textContent = "";
    nextBtn.style.display = "none";
    checkBtn.style.display = "inline-block";
    
    progressDots.forEach((dot, i) => dot.classList.toggle("active", i === currentIdx));

    if (act.type === "ordering") {
      const layout = document.createElement("div");
      layout.className = "layout-container";
      
      const slotsDiv = document.createElement("div");
      slotsDiv.className = "ordering-slots";
      act.correctOrder.forEach((_, i) => {
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.dataset.index = i;
        slot.innerHTML = `<span class="slot-num">${i + 1}</span>`;
        slotsDiv.appendChild(slot);
      });
      
      const rightPanel = document.createElement("div");
      rightPanel.className = "side-panel";
      
      const bankDiv = document.createElement("div");
      bankDiv.className = "bank";
      bankDiv.id = "bank";
      shuffle(act.correctOrder).forEach(c => bankDiv.appendChild(createCard(c.text, c.color)));
      
      const explanationDiv = document.createElement("div");
      explanationDiv.className = "explanation";
      explanationDiv.id = "explanation";
      
      rightPanel.appendChild(bankDiv);
      rightPanel.appendChild(explanationDiv);
      
      layout.appendChild(slotsDiv);
      layout.appendChild(rightPanel);
      gameArea.appendChild(layout);
    } else if (act.type === "sorting") {
      const layout = document.createElement("div");
      layout.className = "layout-container";
      
      const leftCol = document.createElement("div");
      leftCol.className = "side-panel";
      const leftBox = document.createElement("div");
      leftBox.className = "column-box";
      leftBox.innerHTML = `<div class="column-title">${act.categories[0].name}</div>`;
      const leftDrop = document.createElement("div");
      leftDrop.className = "drop-container";
      leftDrop.id = act.categories[0].id;
      leftBox.appendChild(leftDrop);
      leftCol.appendChild(leftBox);
      
      const centerPanel = document.createElement("div");
      centerPanel.className = "center-panel";
      const bankDiv = document.createElement("div");
      bankDiv.className = "bank";
      bankDiv.id = "bank";
      shuffle(act.allCards).forEach(c => bankDiv.appendChild(createCard(c.text, c.color)));
      
      const explanationDiv = document.createElement("div");
      explanationDiv.className = "explanation";
      explanationDiv.id = "explanation";
      centerPanel.appendChild(bankDiv);
      centerPanel.appendChild(explanationDiv);

      const rightCol = document.createElement("div");
      rightCol.className = "side-panel";
      const rightBox = document.createElement("div");
      rightBox.className = "column-box";
      rightBox.innerHTML = `<div class="column-title">${act.categories[1].name}</div>`;
      const rightDrop = document.createElement("div");
      rightDrop.className = "drop-container";
      rightDrop.id = act.categories[1].id;
      rightBox.appendChild(rightDrop);
      rightCol.appendChild(rightBox);
      
      layout.appendChild(leftCol);
      layout.appendChild(centerPanel);
      layout.appendChild(rightCol);
      gameArea.appendChild(layout);
    } else if (act.type === "matching") {
      const layout = document.createElement("div");
      layout.className = "layout-container";
      
      const labelsCol = document.createElement("div");
      labelsCol.className = "matching-labels";
      act.pairs.forEach(p => {
        const lbl = document.createElement("div");
        lbl.className = "matching-label";
        lbl.textContent = p.condition;
        labelsCol.appendChild(lbl);
      });

      const dropsCol = document.createElement("div");
      dropsCol.className = "matching-drops";
      act.pairs.forEach(p => {
        const drop = document.createElement("div");
        drop.className = "matching-drop-zone";
        drop.dataset.condition = p.condition;
        dropsCol.appendChild(drop);
      });

      const rightPanel = document.createElement("div");
      rightPanel.className = "side-panel";
      const bankDiv = document.createElement("div");
      bankDiv.className = "bank";
      bankDiv.id = "bank";
      shuffle(act.pairs).forEach(p => bankDiv.appendChild(createCard(p.finding, p.color)));
      
      const explanationDiv = document.createElement("div");
      explanationDiv.className = "explanation";
      explanationDiv.id = "explanation";
      
      rightPanel.appendChild(bankDiv);
      rightPanel.appendChild(explanationDiv);
      
      layout.appendChild(labelsCol);
      layout.appendChild(dropsCol);
      layout.appendChild(rightPanel);
      gameArea.appendChild(layout);
    }
    setupDragDrop();
  }

  function setupDragDrop() {
    const targets = document.querySelectorAll(".drop-container, .slot, .matching-drop-zone, #bank");
    targets.forEach(target => {
      target.addEventListener("dragover", e => {
        e.preventDefault();
        if (target.id !== "bank") target.classList.add("over");
      });
      target.addEventListener("dragleave", () => target.classList.remove("over"));
      target.addEventListener("drop", e => {
        e.preventDefault();
        target.classList.remove("over");
        const card = document.querySelector(".dragging");
        if (!card) return;

        const act = activities[currentIdx];

        if (target.id === "bank") {
          target.appendChild(card);
        } else if (target.classList.contains("slot") || target.classList.contains("matching-drop-zone")) {
          // Single-item swap logic
          const existing = target.querySelector(".card");
          if (existing && existing !== card) document.getElementById("bank").appendChild(existing);
          target.appendChild(card);
        } else if (target.classList.contains("drop-container")) {
          // Multi-item append logic
          target.appendChild(card);
        }
        message.textContent = "";
        document.querySelectorAll(".slot, .matching-drop-zone").forEach(s => s.classList.remove("correct", "incorrect"));
      });
    });
  }

  checkBtn.addEventListener("click", () => {
    const act = activities[currentIdx];
    let isCorrect = true;
    let totalPlaced = 0;

    if (act.type === "ordering") {
      const slots = document.querySelectorAll(".slot");
      slots.forEach((slot, i) => {
        const card = slot.querySelector(".card");
        slot.classList.remove("correct", "incorrect");
        if (!card) { isCorrect = false; return; }
        totalPlaced++;
        if (card.dataset.text === act.correctOrder[i].text) {
          slot.classList.add("correct");
        } else {
          slot.classList.add("incorrect");
          isCorrect = false;
        }
      });
      if (totalPlaced < act.correctOrder.length) {
        message.textContent = "Order all steps first! 📦";
        message.style.color = "#d35400";
        return;
      }
    } else if (act.type === "sorting") {
      act.categories.forEach(cat => {
        const container = document.getElementById(cat.id);
        const cards = container.querySelectorAll(".card");
        totalPlaced += cards.length;
        cards.forEach(card => {
          if (!cat.correctItems.includes(card.dataset.text)) isCorrect = false;
        });
        if (cards.length !== cat.correctItems.length) isCorrect = false;
      });
      if (totalPlaced < act.allCards.length) {
        message.textContent = "Sort all items first! 📥";
        message.style.color = "#d35400";
        return;
      }
    } else if (act.type === "matching") {
      const drops = document.querySelectorAll(".matching-drop-zone");
      drops.forEach(drop => {
        const card = drop.querySelector(".card");
        drop.classList.remove("correct", "incorrect");
        if (!card) { isCorrect = false; return; }
        totalPlaced++;
        const pair = act.pairs.find(p => p.condition === drop.dataset.condition);
        if (card.dataset.text === pair.finding) {
          drop.classList.add("correct");
        } else {
          drop.classList.add("incorrect");
          isCorrect = false;
        }
      });
      if (totalPlaced < act.pairs.length) {
        message.textContent = "Match all roles first! 🔗";
        message.style.color = "#d35400";
        return;
      }
    }

    if (isCorrect) {
      message.textContent = "🎉 Correct!";
      message.style.color = "#27ae60";
      const explanationBox = document.getElementById("explanation");
      explanationBox.innerHTML = act.explanation;
      explanationBox.style.display = "block";
      document.getElementById("bank").style.display = "none";
      checkBtn.style.display = "none";
      nextBtn.style.display = "inline-block";
      if (currentIdx === activities.length - 1) nextBtn.textContent = "🏁 Finish Challenge";
    } else {
      message.textContent = "Not quite. Try again!";
      message.style.color = "#c0392b";
    }
  });

  nextBtn.addEventListener("click", () => {
    if (currentIdx < activities.length - 1) {
      currentIdx++;
      loadActivity();
    } else {
      instructions.innerHTML = "<h2>EMS Operations Challenge Complete!</h2>";
      gameArea.innerHTML = "<div style='font-size: 80px;'>🏆</div>";
      checkBtn.style.display = "none";
      nextBtn.style.display = "none";
      message.textContent = "Great job, EMT!";
    }
  });

  document.getElementById("resetBtn").addEventListener("click", loadActivity);
  loadActivity();
</script>

</body>
</html>
