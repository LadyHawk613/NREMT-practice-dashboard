<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NREMT OB/GYN Emergencies Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-rose-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">OB/GYN Emergencies Practice</h1>
            <p class="text-rose-100 text-sm mt-1">NREMT EMT National Education Standards</p>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2">
            <div id="progress" class="bg-rose-500 h-2 transition-all duration-500" style="width: 0%"></div>
        </div>

        <div id="quiz-container" class="p-6">
            <!-- Question Section -->
            <div id="question-box" class="fade-in">
                <div class="flex justify-between items-center mb-4">
                    <span id="question-number" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Question 1 of 20</span>
                    <span id="score-display" class="text-xs font-bold text-rose-600 bg-rose-50 px-2 py-1 rounded">Score: 0</span>
                </div>
                
                <h2 id="question-text" class="text-lg font-semibold text-slate-800 mb-6 leading-snug">
                    Loading question...
                </h2>

                <div id="options" class="space-y-3">
                    <!-- Options injected here -->
                </div>

                <!-- Feedback Section (Hidden by default) -->
                <div id="feedback" class="mt-6 p-4 rounded-lg hidden border">
                    <div class="flex items-center mb-2">
                        <span id="feedback-icon" class="mr-2 font-bold"></span>
                        <span id="feedback-status" class="font-bold text-sm uppercase"></span>
                    </div>
                    <p id="feedback-text" class="text-sm text-slate-600 italic"></p>
                </div>

                <!-- Navigation -->
                <button id="next-btn" class="mt-8 w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 px-6 rounded-lg transition-colors hidden shadow-md">
                    Next Question
                </button>
            </div>

            <!-- Results Section (Hidden by default) -->
            <div id="results-box" class="hidden text-center py-10 fade-in">
                <div class="text-6xl mb-4">👶</div>
                <h2 class="text-3xl font-bold text-slate-800 mb-2">Quiz Complete!</h2>
                <p class="text-slate-500 mb-6">You've finished the NREMT OB/GYN Emergencies assessment.</p>
                
                <div class="inline-block p-8 bg-rose-50 rounded-2xl mb-8 border border-rose-100">
                    <div id="final-score" class="text-5xl font-bold text-rose-700 mb-2">0/20</div>
                    <div id="percentage" class="text-xl font-semibold text-rose-500">0%</div>
                </div>

                <div id="result-message" class="mb-8 px-4 text-slate-700 italic"></div>
                
                <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-lg transition-colors shadow-md">
                    Try Again
                </button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "A 28-year-old female who is 36 weeks pregnant complains of severe abdominal pain and vaginal bleeding. She states the pain began suddenly and is constant. Her abdomen is rigid and tender. Vital signs are BP 96/60, HR 118, RR 22. What should the EMT suspect?",
                options: [
                    "Placenta previa",
                    "Abruptio placentae",
                    "Ectopic pregnancy",
                    "Normal labor"
                ],
                answer: 1,
                explanation: "Abruptio placentae is premature separation of the placenta. Classic findings include sudden abdominal pain, rigid/tender uterus, vaginal bleeding, and signs of shock. Placenta previa usually causes painless vaginal bleeding."
            },
            {
                q: "A pregnant patient in her third trimester becomes dizzy and pale while lying flat on the stretcher. Her blood pressure drops. What is the most appropriate EMT intervention?",
                options: [
                    "Place her in a supine position",
                    "Elevate her legs above her heart",
                    "Position her on her left side",
                    "Place her in a prone position"
                ],
                answer: 2,
                explanation: "The uterus can compress the inferior vena cava when a pregnant patient lies supine, reducing blood return to the heart. Left lateral positioning improves circulation."
            },
            {
                q: "During delivery, the baby's head delivers, but the shoulders do not emerge with the next contraction. What should the EMT do first?",
                options: [
                    "Pull gently on the baby's head",
                    "Apply pressure to the mother's abdomen",
                    "Encourage the mother to stop pushing",
                    "Perform the McRoberts maneuver"
                ],
                answer: 3,
                explanation: "Shoulder dystocia is an emergency where the shoulders become stuck. The McRoberts maneuver (flexing the mother's legs tightly toward her chest) helps widen the pelvis."
            },
            {
                q: "A newborn is delivered and begins crying loudly. The baby is warm, breathing normally, and has good muscle tone. What should the EMT do next?",
                options: [
                    "Begin chest compressions",
                    "Dry, warm, and monitor the newborn",
                    "Immediately suction the airway",
                    "Provide oxygen by mask"
                ],
                answer: 1,
                explanation: "A vigorous newborn requires routine care: warmth, drying, stimulation, and monitoring. Routine suctioning is not recommended."
            },
            {
                q: "A 19-year-old female complains of lower abdominal pain and vaginal bleeding. She states she missed her last menstrual period and has not seen a doctor. She becomes pale and tachycardic. What condition should the EMT suspect?",
                options: [
                    "Miscarriage only",
                    "Ectopic pregnancy",
                    "Placenta previa",
                    "Normal pregnancy changes"
                ],
                answer: 1,
                explanation: "A ruptured ectopic pregnancy can cause internal bleeding, abdominal pain, vaginal bleeding, and shock."
            },
            {
                q: "A woman in labor tells you she feels the urge to have a bowel movement. She is having contractions every 2 minutes. What should the EMT do?",
                options: [
                    "Encourage her to walk to the bathroom",
                    "Check for crowning",
                    "Administer pain medication",
                    "Delay transport until contractions stop"
                ],
                answer: 1,
                explanation: "The urge to push or have a bowel movement may indicate imminent delivery. The EMT should assess for crowning."
            },
            {
                q: "A newborn is delivered but is not breathing after drying and stimulation. What is the EMT's next action?",
                options: [
                    "Begin CPR immediately",
                    "Provide positive pressure ventilation",
                    "Transport without intervention",
                    "Suction for 30 seconds"
                ],
                answer: 1,
                explanation: "For a newborn who is not breathing or has inadequate respirations, ventilation is the priority."
            },
            {
                q: "A pregnant patient with severe hypertension complains of headache, visual disturbances, and nausea. What condition is most likely?",
                options: [
                    "Eclampsia",
                    "Preeclampsia",
                    "Placenta previa",
                    "Gestational diabetes"
                ],
                answer: 1,
                explanation: "Preeclampsia involves hypertension during pregnancy with symptoms such as headache, vision changes, and possible organ involvement."
            },
            {
                q: "A pregnant patient begins having generalized seizures. What is the EMT's priority?",
                options: [
                    "Restrain the patient",
                    "Protect the airway and prevent injury",
                    "Place something in her mouth",
                    "Attempt to stop the seizure physically"
                ],
                answer: 1,
                explanation: "Eclampsia is seizure activity related to pregnancy complications. Manage the seizure safely and support airway and breathing."
            },
            {
                q: "A newborn has a heart rate of 80 beats/min after delivery and is breathing irregularly. What is the priority intervention?",
                options: [
                    "Begin chest compressions",
                    "Provide positive pressure ventilation",
                    "Administer oral glucose",
                    "Wait five minutes before treating"
                ],
                answer: 1,
                explanation: "In newborn resuscitation, inadequate breathing requires ventilation. Heart rate should improve with effective ventilation."
            },
            {
                q: "A patient at 30 weeks gestation has painless bright-red vaginal bleeding. She denies abdominal pain. Which condition is most likely?",
                options: [
                    "Abruptio placentae",
                    "Placenta previa",
                    "Ectopic pregnancy",
                    "Uterine rupture"
                ],
                answer: 1,
                explanation: "Placenta previa typically causes painless vaginal bleeding late in pregnancy."
            },
            {
                q: "During delivery, the EMT sees the umbilical cord wrapped around the baby's neck. What should the EMT do?",
                options: [
                    "Pull firmly on the cord",
                    "Attempt to cut the cord immediately",
                    "Gently slip the cord over the baby's head if possible",
                    "Push the baby's head back into the birth canal"
                ],
                answer: 2,
                explanation: "A loose nuchal cord can often be slipped over the baby's head. Do not pull on the cord."
            },
            {
                q: "After delivery, the mother has heavy vaginal bleeding. The uterus feels soft and enlarged. What should the EMT suspect?",
                options: [
                    "Ectopic pregnancy",
                    "Uterine rupture",
                    "Uterine atony",
                    "Normal postpartum bleeding"
                ],
                answer: 2,
                explanation: "Uterine atony occurs when the uterus fails to contract after delivery, causing postpartum hemorrhage."
            },
            {
                q: "A newborn is covered in a thick green substance immediately after birth. What does this indicate?",
                options: [
                    "Normal skin lubrication",
                    "Possible fetal distress",
                    "Infection",
                    "Premature birth only"
                ],
                answer: 1,
                explanation: "Meconium in amniotic fluid may indicate fetal stress before delivery."
            },
            {
                q: "A patient who is 8 months pregnant complains of shortness of breath. Her oxygen saturation is 88%. What should the EMT do first?",
                options: [
                    "Place her supine",
                    "Apply oxygen and support ventilation",
                    "Encourage her to walk",
                    "Delay care until arrival at the hospital"
                ],
                answer: 1,
                explanation: "Pregnancy increases oxygen demands. Hypoxia must be treated immediately."
            },
            {
                q: "A woman experiencing labor has contractions that are becoming stronger and closer together. Which finding indicates she is in the second stage of labor?",
                options: [
                    "Cervical dilation begins",
                    "The fetus begins developing organs",
                    "She feels an urge to push",
                    "Morning sickness develops"
                ],
                answer: 2,
                explanation: "The second stage begins when the cervix is fully dilated and ends with delivery."
            },
            {
                q: "A newborn is delivered and has poor muscle tone, no breathing, and a heart rate of 90. What is the first priority?",
                options: [
                    "Positive pressure ventilation",
                    "Chest compressions",
                    "Oral suctioning",
                    "Medication administration"
                ],
                answer: 0,
                explanation: "Ventilation is the most important intervention in newborn resuscitation."
            },
            {
                q: "A pregnant patient involved in a motor vehicle crash has abdominal pain and vaginal bleeding. Which action is most appropriate?",
                options: [
                    "Delay transport until contractions begin",
                    "Treat for shock and transport rapidly",
                    "Place her sitting upright",
                    "Perform a vaginal examination"
                ],
                answer: 1,
                explanation: "Trauma during pregnancy may cause placental injury and hemorrhage. Rapid transport is indicated."
            },
            {
                q: "A patient states she is 39 weeks pregnant and feels something coming out of her vagina before the baby. Upon assessment, the EMT sees the umbilical cord. What is the priority action?",
                options: [
                    "Push the cord back inside",
                    "Place the mother in a knee-chest position",
                    "Pull on the cord gently",
                    "Continue normal delivery"
                ],
                answer: 1,
                explanation: "A prolapsed cord can cut off oxygen to the fetus. Positioning reduces pressure on the cord while transporting rapidly."
            },
            {
                q: "A newborn has a heart rate of 50 beats/min despite effective ventilation. What should the EMT do?",
                options: [
                    "Continue ventilation only",
                    "Begin chest compressions",
                    "Stop treatment",
                    "Provide oral fluids"
                ],
                answer: 1,
                explanation: "A newborn with a heart rate below 60 after effective ventilation requires chest compressions."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options');
        const questionNumber = document.getElementById('question-number');
        const scoreDisplay = document.getElementById('score-display');
        const feedback = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackStatus = document.getElementById('feedback-status');
        const feedbackIcon = document.getElementById('feedback-icon');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress');

        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestion];
            
            // Reset UI
            feedback.classList.add('hidden');
            nextBtn.classList.add('hidden');
            optionsContainer.innerHTML = '';
            
            // Set Text
            questionNumber.innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
            questionText.innerText = q.q;
            progressBar.style.width = `${((currentQuestion) / questions.length) * 100}%`;

            // Create Options
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-lg border-2 border-slate-200 hover:border-rose-300 hover:bg-rose-50 transition-all font-medium text-slate-700 flex items-start";
                btn.innerHTML = `<span class="bg-slate-100 text-slate-500 w-6 h-6 rounded-full inline-flex items-center justify-center mr-3 flex-shrink-0 text-xs">${String.fromCharCode(65 + index)}</span> <span>${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, clickedBtn) {
            if (answered) return;
            answered = true;

            const correct = questions[currentQuestion].answer;
            const allBtns = optionsContainer.querySelectorAll('button');

            if (selectedIndex === correct) {
                score++;
                scoreDisplay.innerText = `Score: ${score}`;
                clickedBtn.classList.replace('border-slate-200', 'border-green-500');
                clickedBtn.classList.add('bg-green-50');
                showFeedback(true);
            } else {
                clickedBtn.classList.replace('border-slate-200', 'border-red-500');
                clickedBtn.classList.add('bg-red-50');
                allBtns[correct].classList.replace('border-slate-200', 'border-green-500');
                allBtns[correct].classList.add('bg-green-50');
                showFeedback(false);
            }

            allBtns.forEach(btn => btn.disabled = true);
            nextBtn.classList.remove('hidden');
            
            if (currentQuestion === questions.length - 1) {
                nextBtn.innerText = "See Results";
            }
        }

        function showFeedback(isCorrect) {
            feedback.classList.remove('hidden');
            if (isCorrect) {
                feedback.classList.add('bg-green-50', 'border-green-100');
                feedback.classList.remove('bg-red-50', 'border-red-100');
                feedbackStatus.innerText = "Correct";
                feedbackStatus.className = "font-bold text-sm uppercase text-green-700";
                feedbackIcon.innerText = "✓";
                feedbackIcon.className = "mr-2 font-bold text-green-700";
            } else {
                feedback.classList.add('bg-red-50', 'border-red-100');
                feedback.classList.remove('bg-green-50', 'border-green-100');
                feedbackStatus.innerText = "Incorrect";
                feedbackStatus.className = "font-bold text-sm uppercase text-red-700";
                feedbackIcon.innerText = "✗";
                feedbackIcon.className = "mr-2 font-bold text-red-700";
            }
            feedbackText.innerText = questions[currentQuestion].explanation;
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            document.getElementById('question-box').classList.add('hidden');
            const resultsBox = document.getElementById('results-box');
            resultsBox.classList.remove('hidden');
            progressBar.style.width = '100%';

            const finalScore = document.getElementById('final-score');
            const percentage = document.getElementById('percentage');
            const message = document.getElementById('result-message');

            const percent = Math.round((score / questions.length) * 100);
            finalScore.innerText = `${score}/${questions.length}`;
            percentage.innerText = `${percent}%`;

            if (percent >= 85) {
                message.innerText = "Outstanding job! You have demonstrated strong clinical decision-making skills in NREMT OB/GYN & Neonatal care.";
            } else if (percent >= 70) {
                message.innerText = "Good effort! Review the questions you missed, especially neonatal resuscitation parameters, prolapsed cord management, and obstetrical complications.";
            } else {
                message.innerText = "Keep practicing! Revisit the core OB/GYN topics, paying close attention to neonatal CPR/ventilation algorithms and maternal positioning.";
            }
        }

        // Initialize quiz
        loadQuestion();
    </script>
</body>
</html>
