<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NREMT Practice Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-indigo-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">NREMT Clinical Reasoning Practice</h1>
            <p class="text-indigo-100 text-sm mt-1">NREMT Cognitive Exam (Prioritization & Assessment)</p>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2">
            <div id="progress" class="bg-indigo-500 h-2 transition-all duration-500" style="width: 0%"></div>
        </div>

        <div id="quiz-container" class="p-6">
            <!-- Question Section -->
            <div id="question-box" class="fade-in">
                <div class="flex justify-between items-center mb-4">
                    <span id="question-number" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Question 1 of 8</span>
                    <span id="score-display" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">Score: 0</span>
                </div>
                
                <h2 id="question-text" class="text-lg font-semibold text-slate-800 mb-6 leading-snug">
                    Loading question...
                </h2>

                <div id="options" class="space-y-3">
                    <!-- Options injected here -->
                </div>

                <!-- Feedback Section (Hidden by default) -->
                <div id="feedback" class="mt-6 p-4 rounded-lg hidden border">
                    <div class="flex items-center mb-2">
                        <span id="feedback-icon" class="mr-2 font-bold"></span>
                        <span id="feedback-status" class="font-bold text-sm uppercase"></span>
                    </div>
                    <div id="feedback-text" class="text-sm text-slate-600 space-y-2"></div>
                </div>

                <!-- Navigation -->
                <button id="next-btn" class="mt-8 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition-colors hidden shadow-md">
                    Next Question
                </button>
            </div>

            <!-- Results Section (Hidden by default) -->
            <div id="results-box" class="hidden text-center py-10 fade-in">
                <div class="text-6xl mb-4">🚑</div>
                <h2 class="text-3xl font-bold text-slate-800 mb-2">Quiz Complete!</h2>
                <p class="text-slate-500 mb-6">You've finished the NREMT Challenge Assessment.</p>
                
                <div class="inline-block p-8 bg-indigo-50 rounded-2xl mb-8 border border-indigo-100">
                    <div id="final-score" class="text-5xl font-bold text-indigo-700 mb-2">0/8</div>
                    <div id="percentage" class="text-xl font-semibold text-indigo-500">0%</div>
                </div>

                <div id="result-message" class="mb-8 px-4 text-slate-700 italic"></div>
                
                <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-lg transition-colors shadow-md">
                    Try Again
                </button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "1. A 72-year-old male with a history of congestive heart failure is sitting upright on the edge of his bed. He is anxious, pale, and breathing rapidly. He can only speak in short phrases. His oxygen saturation is 82% on room air. What should you do FIRST?",
                options: [
                    "Obtain a detailed SAMPLE history to determine the cause of his condition",
                    "Apply a nonrebreather mask and reassess his oxygen saturation",
                    "Listen to lung sounds to determine whether fluid is present",
                    "Prepare the patient for rapid transport to a hospital"
                ],
                answer: 1,
                explanation: "<strong>Why this is difficult:</strong> All four choices are appropriate actions.<br><br><strong>Why B is best:</strong> The patient has a life-threatening oxygenation problem. Oxygen administration addresses the immediate threat.<br><br><strong>Why the others are wrong:</strong><br>• <strong>A (Almost right):</strong> SAMPLE is important, but history does not correct hypoxia.<br>• <strong>C (Almost right):</strong> Lung sounds help identify CHF, but assessment should not delay treatment of a clear breathing emergency.<br>• <strong>D (Almost right):</strong> Transport is necessary, but the patient needs stabilization before movement."
            },
            {
                q: "2. You arrive at a construction accident involving a 35-year-old male who fell approximately 20 feet. The patient is alert and complaining of severe lower leg pain. You notice the leg is deformed and bleeding moderately.\n\nYour primary assessment reveals:\n• Airway open\n• Respirations adequate\n• Skin cool and pale\n• Pulse rapid and weak\n\nWhat should you do FIRST?",
                options: [
                    "Apply a traction splint to stabilize the leg injury",
                    "Control the bleeding and treat for shock",
                    "Perform a detailed neurologic assessment",
                    "Apply a cervical collar due to the mechanism of injury"
                ],
                answer: 1,
                explanation: "<strong>Why this is difficult:</strong> The leg injury is dramatic and distracts the student.<br><br><strong>Why B is best:</strong> The patient is showing signs of poor circulation and possible shock.<br><br><strong>Why the others are wrong:</strong><br>• <strong>A (Almost right):</strong> The fracture may require splinting, but splinting is not the priority if shock is developing.<br>• <strong>C (Almost right):</strong> Neurologic assessment is important, but circulation problems take priority.<br>• <strong>D (Almost right):</strong> The mechanism suggests spinal injury, but the patient currently shows signs of circulatory compromise."
            },
            {
                q: "3. A 58-year-old male complains of chest pressure that began 30 minutes ago. He is alert and speaking clearly.\n\nAssessment:\n• Airway clear\n• Breathing adequate\n• Skin warm and dry\n• Blood pressure normal\n\nWhat should you do next?",
                options: [
                    "Administer aspirin if allowed by protocol",
                    "Apply the AED because the patient may have a heart attack",
                    "Immediately begin transport without further assessment",
                    "Obtain a complete SAMPLE history before providing treatment"
                ],
                answer: 0,
                explanation: "<strong>Why this is difficult:</strong> Several answers sound reasonable.<br><br><strong>Why A is best:</strong> The patient is stable and may benefit from aspirin for suspected cardiac ischemia.<br><br><strong>Why the others are wrong:</strong><br>• <strong>B (Almost right):</strong> Heart attacks can cause cardiac arrest, but AEDs are not used on conscious patients with pulses.<br>• <strong>C (Almost right):</strong> Transport is important, but appropriate treatment should not be delayed.<br>• <strong>D (Almost right):</strong> SAMPLE is needed, but treatment should not always wait for history."
            },
            {
                q: "4. A 45-year-old male was rescued from a house fire. He has facial burns, soot around his mouth, singed nasal hairs, and a hoarse voice. He is alert and breathing adequately. What is your priority?",
                options: [
                    "Apply high-flow oxygen by nonrebreather mask",
                    "Determine the percentage of burns using the rule of nines",
                    "Prepare for airway management and rapid transport",
                    "Obtain a complete medical history from the patient"
                ],
                answer: 2,
                explanation: "<strong>Why this is difficult:</strong> Oxygen is correct, but not the best answer.<br><br><strong>Why C is best:</strong> Signs of inhalation injury may indicate impending airway swelling.<br><br><strong>Why the others are wrong:</strong><br>• <strong>A (Almost right):</strong> Oxygen is needed, but oxygen alone does not solve possible airway obstruction.<br>• <strong>B (Almost right):</strong> Burn size matters, but airway takes priority.<br>• <strong>D (Almost right):</strong> History matters, but not before airway concerns."
            },
            {
                q: "5. You arrive for a 64-year-old female who is confused and unable to answer questions appropriately.\n\nAssessment:\n• Airway open\n• Respirations normal\n• Skin cool and sweaty\n• Patient has diabetes\n\nWhat should you do FIRST?",
                options: [
                    "Ask family members what medications the patient takes",
                    "Check the patient's blood glucose level if permitted by protocol",
                    "Perform a complete secondary assessment",
                    "Transport immediately because altered mental status is present"
                ],
                answer: 1,
                explanation: "<strong>Why this is difficult:</strong> Several choices are appropriate.<br><br><strong>Why B is best:</strong> Hypoglycemia is a reversible cause of altered mental status and should be evaluated early.<br><br><strong>Why the others are wrong:</strong><br>• <strong>A (Almost right):</strong> Medication history helps, but glucose may identify a treatable emergency.<br>• <strong>C (Almost right):</strong> A secondary assessment is needed, but not before evaluating a possible immediate cause.<br>• <strong>D (Almost right):</strong> Transport is necessary, but assessment and treatment begin first."
            },
            {
                q: "6. You respond to a 3-year-old child with difficulty breathing.\n\nFindings:\n• Respiratory rate 42/min\n• Retractions present\n• Child is sitting quietly with poor eye contact\n• Parent says, 'He has been getting worse all day.'\n\nWhat concerns you MOST?",
                options: [
                    "The child's respiratory rate is higher than normal",
                    "The child may be tiring and developing respiratory failure",
                    "The child probably has a respiratory infection",
                    "The parent may not be describing the symptoms accurately"
                ],
                answer: 1,
                explanation: "<strong>Why this is difficult:</strong> Option A is true, but Option B shows deeper understanding.<br><br><strong>Why B is best:</strong> Children can compensate until they suddenly deteriorate. A quiet child with increased work of breathing may indicate fatigue and imminent respiratory failure."
            },
            {
                q: "7. A 42-year-old patient fell while intoxicated. He refuses transport and says he feels fine. You determine he understands the risks, can explain the consequences, and is alert and oriented. What should you do?",
                options: [
                    "Transport him because intoxicated patients cannot refuse care",
                    "Allow the refusal after completing appropriate documentation",
                    "Treat him for possible head injury despite his refusal",
                    "Ask police to force him to go to the hospital"
                ],
                answer: 1,
                explanation: "<strong>Why this is difficult:</strong> Many students believe alcohol automatically removes decision-making ability.<br><br><strong>Why B is best:</strong> A competent adult who understands risks and consequences has the right to refuse care."
            },
            {
                q: "8. You arrive for a patient complaining of shortness of breath.\n\nInitial findings:\n• Alert, sitting upright\n• Respiratory rate 30/min, wheezing\n• Speaking in full sentences\nYou administer oxygen.\n\nFive minutes later:\n• Patient becomes exhausted\n• Speech becomes limited\n• Respiratory effort decreases\n\nWhat should you do?",
                options: [
                    "Continue oxygen because it was already helping",
                    "Begin ventilatory support because respiratory failure is developing",
                    "Obtain a complete set of vital signs before changing treatment",
                    "Ask more questions about the patient's medical history"
                ],
                answer: 1,
                explanation: "<strong>Why this is difficult:</strong> The first treatment was appropriate, but the patient's condition changed.<br><br><strong>Why B is best:</strong> A patient who is tiring and losing respiratory effort needs ventilatory support."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options');
        const questionNumber = document.getElementById('question-number');
        const scoreDisplay = document.getElementById('score-display');
        const feedback = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackStatus = document.getElementById('feedback-status');
        const feedbackIcon = document.getElementById('feedback-icon');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress');

        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestion];
            
            feedback.classList.add('hidden');
            nextBtn.classList.add('hidden');
            optionsContainer.innerHTML = '';
            
            questionNumber.innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
            questionText.innerText = q.q;
            progressBar.style.width = `${((currentQuestion) / questions.length) * 100}%`;

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-lg border-2 border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 transition-all font-medium text-slate-700 flex items-start";
                btn.innerHTML = `<span class="bg-slate-100 text-slate-500 w-6 h-6 rounded-full inline-flex items-center justify-center mr-3 flex-shrink-0 text-xs">${String.fromCharCode(65 + index)}</span> <span>${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, clickedBtn) {
            if (answered) return;
            answered = true;

            const correct = questions[currentQuestion].answer;
            const allBtns = optionsContainer.querySelectorAll('button');

            if (selectedIndex === correct) {
                score++;
                scoreDisplay.innerText = `Score: ${score}`;
                clickedBtn.classList.replace('border-slate-200', 'border-green-500');
                clickedBtn.classList.add('bg-green-50');
                showFeedback(true);
            } else {
                clickedBtn.classList.replace('border-slate-200', 'border-red-500');
                clickedBtn.classList.add('bg-red-50');
                allBtns[correct].classList.replace('border-slate-200', 'border-green-500');
                allBtns[correct].classList.add('bg-green-50');
                showFeedback(false);
            }

            allBtns.forEach(btn => btn.disabled = true);
            nextBtn.classList.remove('hidden');
            
            if (currentQuestion === questions.length - 1) {
                nextBtn.innerText = "See Results";
            }
        }

        function showFeedback(isCorrect) {
            feedback.classList.remove('hidden');
            if (isCorrect) {
                feedback.classList.add('bg-green-50', 'border-green-100');
                feedback.classList.remove('bg-red-50', 'border-red-100');
                feedbackStatus.innerText = "Correct";
                feedbackStatus.className = "font-bold text-sm uppercase text-green-700";
                feedbackIcon.innerText = "✓";
                feedbackIcon.className = "mr-2 font-bold text-green-700";
            } else {
                feedback.classList.add('bg-red-50', 'border-red-100');
                feedback.classList.remove('bg-green-50', 'border-green-100');
                feedbackStatus.innerText = "Incorrect";
                feedbackStatus.className = "font-bold text-sm uppercase text-red-700";
                feedbackIcon.innerText = "✗";
                feedbackIcon.className = "mr-2 font-bold text-red-700";
            }
            feedbackText.innerHTML = questions[currentQuestion].explanation;
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            document.getElementById('question-box').classList.add('hidden');
            const resultsBox = document.getElementById('results-box');
            resultsBox.classList.remove('hidden');
            progressBar.style.width = '100%';

            const finalScore = document.getElementById('final-score');
            const percentage = document.getElementById('percentage');
            const message = document.getElementById('result-message');

            const percent = Math.round((score / questions.length) * 100);
            finalScore.innerText = `${score}/${questions.length}`;
            percentage.innerText = `${percent}%`;

            if (percent >= 85) {
                message.innerText = "Outstanding job! You have demonstrated exceptional mastery of clinical reasoning, prioritization, and NREMT decision-making frameworks.";
            } else if (percent >= 70) {
                message.innerText = "Good effort! Review the scenarios you missed, focusing on primary vs. secondary priorities and recognizing immediate life threats.";
            } else {
                message.innerText = "Keep practicing! Revisit primary assessment steps, airway interventions, and NREMT testing priorities.";
            }
        }

        loadQuestion();
    </script>
</body>
</html>
