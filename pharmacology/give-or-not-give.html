<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NREMT Medication Decision Challenge</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eef3f8;
    margin:0;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h1{
    color:#0B3B6A;
    text-align:center;
}

h2{
    color:#1d5d99;
}

.card{
    background:#f7f9fc;
    border-left:6px solid #0B3B6A;
    padding:20px;
    margin:20px 0;
    border-radius:8px;
}

button{
    padding:15px 25px;
    font-size:18px;
    margin:10px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

.give{
    background:#2e8b57;
    color:white;
}

.no{
    background:#c0392b;
    color:white;
}

.next{
    background:#0B3B6A;
    color:white;
    display:none;
}

.feedback{
    margin-top:20px;
    padding:15px;
    font-size:18px;
    border-radius:8px;
    display:none;
}

.correct{
    background:#d4edda;
    color:#155724;
}

.incorrect{
    background:#f8d7da;
    color:#721c24;
}

.reasoning{
    margin-top:20px;
    display:none;
    background:#fff8dc;
    padding:15px;
    border-radius:8px;
}

.progress{
    text-align:right;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>NREMT Medication Decision Challenge</h1>

<div class="progress" id="progress"></div>

<div id="quiz"></div>

</div>

<script>

const questions=[

{
med:"Nitroglycerin",
scenario:`64-year-old male with crushing chest pain.<br>
BP: <b>84/58</b><br>
Pulse: 96<br>
Patient has prescribed nitroglycerin.`,
correct:"NO",
why:"Nitroglycerin is contraindicated because the patient is hypotensive.",
reason:"Ask yourself:<br><br>• What is the indication?<br>• What is the blood pressure?<br>• Could nitroglycerin make this worse?"
},

{
med:"Aspirin",
scenario:`58-year-old female with crushing chest pain.<br>
No allergies.<br>
Able to chew.<br>
No active bleeding.`,
correct:"GIVE",
why:"This patient has no contraindications and meets indications for aspirin.",
reason:"Always check for allergy, bleeding, and ability to swallow."
},

{
med:"Oral Glucose",
scenario:`Diabetic patient.<br>
Blood glucose 42 mg/dL.<br>
Patient is unconscious.`,
correct:"NO",
why:"Never give oral glucose to a patient who cannot swallow.",
reason:"Protect the airway first."
},

{
med:"Epinephrine",
scenario:`Bee sting.<br>
Facial swelling.<br>
Wheezing.<br>
Difficulty breathing.`,
correct:"GIVE",
why:"This is anaphylaxis requiring immediate epinephrine.",
reason:"Airway swelling = epinephrine."
},

{
med:"Naloxone",
scenario:`Unresponsive patient.<br>
Respirations 6/min.<br>
Pinpoint pupils.`,
correct:"GIVE",
why:"Classic opioid overdose with respiratory depression.",
reason:"Naloxone reverses opioid effects."
},

{
med:"Nitroglycerin",
scenario:`Chest pain.<br>
BP 138/82.<br>
Patient took Viagra 6 hours ago.`,
correct:"NO",
why:"Recent PDE-5 inhibitor use is a contraindication.",
reason:"Risk of profound hypotension."
},

{
med:"Albuterol",
scenario:`Known asthma.<br>
Audible wheezing.<br>
SpO₂ 89%.`,
correct:"GIVE",
why:"Bronchospasm is an indication for albuterol.",
reason:"Always verify it is the patient's prescribed inhaler."
},

{
med:"Aspirin",
scenario:`Chest pain.<br>
Vomiting bright red blood.`,
correct:"NO",
why:"Active bleeding is a contraindication.",
reason:"Aspirin increases bleeding risk."
},

{
med:"Oral Glucose",
scenario:`Diabetic.<br>
Blood glucose 48 mg/dL.<br>
Alert and able to swallow.`,
correct:"GIVE",
why:"Conscious hypoglycemic patients may receive oral glucose.",
reason:"The patient must be able to swallow."
},

{
med:"Oxygen",
scenario:`Respiratory distress.<br>
SpO₂ 83%.`,
correct:"GIVE",
why:"Hypoxemia is an indication for oxygen.",
reason:"Provide oxygen according to local protocol and reassess."
}

];

let current=0;
let score=0;

function loadQuestion(){

document.getElementById("progress").innerHTML=
`Question ${current+1} of ${questions.length} | Score: ${score}`;

const q=questions[current];

document.getElementById("quiz").innerHTML=`

<h2>${q.med}</h2>

<div class="card">

${q.scenario}

</div>

<h3>Would you give this medication?</h3>

<button class="give" onclick="answer('GIVE')">
✔ Give Medication
</button>

<button class="no" onclick="answer('NO')">
✘ Do NOT Give
</button>

<div id="feedback" class="feedback"></div>

<div id="reasoning" class="reasoning">
<h3>Clinical Reasoning</h3>
${q.reason}
</div>

<button id="next" class="next" onclick="nextQuestion()">
Next Case →
</button>

`;

}

function answer(choice){

const q=questions[current];

let fb=document.getElementById("feedback");

fb.style.display="block";

document.getElementById("reasoning").style.display="block";
document.getElementById("next").style.display="inline-block";

if(choice===q.correct){

score++;

fb.className="feedback correct";

fb.innerHTML="<b>Correct!</b><br><br>"+q.why;

}else{

fb.className="feedback incorrect";

fb.innerHTML="<b>Incorrect.</b><br><br>"+q.why;

}

document.querySelectorAll("button.give,button.no")
.forEach(btn=>btn.disabled=true);

document.getElementById("progress").innerHTML=
`Question ${current+1} of ${questions.length} | Score: ${score}`;

}

function nextQuestion(){

current++;

if(current>=questions.length){

document.getElementById("quiz").innerHTML=

`<h1>Challenge Complete!</h1>

<h2>Your Score</h2>

<h1>${score} / ${questions.length}</h1>

<p style="font-size:22px">

Discuss every missed question before moving to the next lesson.

</p>`;

document.getElementById("progress").innerHTML="Finished";

return;

}

loadQuestion();

}

loadQuestion();

</script>

</body>
</html>
